/* ============================================================
   LOCAL STORAGE SHIM
   Standalone replacement for the Claude-artifact-only window.storage
   API, backed by the browser's real localStorage. Same method shapes
   (get/set/delete/list, all async, all return {key, value} objects)
   so none of the app code below needs to change.
   ============================================================ */
const STORAGE_PREFIX = "spray-ticket:";
// Probe real localStorage. It throws on opaque origins (some preview sandboxes)
// and is disabled for file:// pages in Firefox — fall back to an in-memory store
// so the app still works for the session instead of flashing a save-failed warning.
const _mem = new Map();
let _ls = null;
try {
  const t = STORAGE_PREFIX + "__probe__";
  window.localStorage.setItem(t, "1");
  window.localStorage.removeItem(t);
  _ls = window.localStorage;
} catch (e) {
  _ls = null;
}
window.storage = {
  async get(key) {
    const k = STORAGE_PREFIX + key;
    let v = null;
    try { v = _ls ? _ls.getItem(k) : (_mem.has(k) ? _mem.get(k) : null); }
    catch (e) { v = _mem.has(k) ? _mem.get(k) : null; }
    if (v == null) return null;
    return {
      key,
      value: v
    };
  },
  async set(key, value) {
    const k = STORAGE_PREFIX + key;
    try {
      if (_ls) _ls.setItem(k, value);
      else _mem.set(k, value);
    } catch (e) {
      _mem.set(k, value);
    }
    return {
      key,
      value
    };
  },
  async delete(key) {
    const k = STORAGE_PREFIX + key;
    try { if (_ls) _ls.removeItem(k); } catch (e) {}
    _mem.delete(k);
    return {
      key,
      deleted: true
    };
  },
  async list(prefix) {
    const full = STORAGE_PREFIX + (prefix || "");
    let src = [];
    try { src = _ls ? Object.keys(_ls) : Array.from(_mem.keys()); }
    catch (e) { src = Array.from(_mem.keys()); }
    const keys = src.filter(k => k.startsWith(full)).map(k => k.slice(STORAGE_PREFIX.length));
    return {
      keys
    };
  }
};

/* ============================================================
   LIVE WEATHER (ZIP -> spray-relevant conditions)
   ZIP -> lat/lon via api.zippopotam.us (free, no key), then
   current + 31 days back + 3 days forward from Open-Meteo
   (free, no key, CORS-open). All spray-timing math is done here
   so the UI layer just renders {current, history, forecast, flags}.
   ============================================================ */

const WIND_CARDINALS = ["N", "NNE", "NE", "ENE", "E", "ESE", "SE", "SSE", "S", "SSW", "SW", "WSW", "W", "WNW", "NW", "NNW"];
const windCardinal = deg => WIND_CARDINALS[Math.round(((deg || 0) % 360) / 22.5) % 16];

// Stull (2011) wet-bulb approximation, then Delta-T (dry-bulb minus wet-bulb, in °C).
// Delta-T is the standard sprayer-friendly read on evaporation: ~2–8 ideal, 8–10
// marginal, >10 too much droplet loss, <2 very slow drying / inversion-prone.
function deltaT_C(tempF, rhPct) {
  if (tempF == null || rhPct == null) return null;
  const T = (tempF - 32) * 5 / 9;
  const rh = Math.max(1, Math.min(100, rhPct));
  const Tw =
    T * Math.atan(0.151977 * Math.sqrt(rh + 8.313659)) +
    Math.atan(T + rh) -
    Math.atan(rh - 1.676331) +
    0.00391838 * Math.pow(rh, 1.5) * Math.atan(0.023101 * rh) -
    4.686035;
  return Math.round((T - Tw) * 10) / 10;
}

async function geocodeZip(zip) {
  const r = await fetch(`https://api.zippopotam.us/us/${zip}`);
  if (!r.ok) throw new Error(`ZIP ${zip} not found — check the digits.`);
  const j = await r.json();
  const p = (j.places || [])[0];
  if (!p) throw new Error(`No location on file for ZIP ${zip}.`);
  return {
    lat: Number(p.latitude),
    lon: Number(p.longitude),
    place: `${p["place name"]}, ${p["state abbreviation"]} ${zip}`
  };
}

async function fetchOpenMeteo(lat, lon) {
  const qs = new URLSearchParams({
    latitude: lat,
    longitude: lon,
    current: "temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m,wind_gusts_10m,wind_direction_10m,is_day",
    hourly: "precipitation,precipitation_probability,wind_speed_10m,wind_gusts_10m,wind_direction_10m,temperature_2m,relative_humidity_2m,is_day",
    daily: "temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max",
    temperature_unit: "fahrenheit",
    wind_speed_unit: "mph",
    precipitation_unit: "inch",
    timezone: "auto",
    past_days: "31",
    forecast_days: "4"
  });
  const r = await fetch(`https://api.open-meteo.com/v1/forecast?${qs}`);
  if (!r.ok) throw new Error("Weather service didn't respond — try again in a minute.");
  return r.json();
}

function buildSprayWeather(place, raw) {
  const cur = raw.current || {};
  const daily = raw.daily || {};
  const hourly = raw.hourly || {};
  const nowISO = cur.time || new Date().toISOString().slice(0, 16);
  const today = nowISO.slice(0, 10);

  // ---- rain history: days since last measurable (>=0.01") rain, and 14-day total
  const dTimes = daily.time || [];
  const dRain = daily.precipitation_sum || [];
  const dTMax = daily.temperature_2m_max || [];
  let daysSinceRain = null;
  let rain14 = 0;
  const todayIdx = dTimes.indexOf(today);
  const lastIdx = todayIdx >= 0 ? todayIdx : dTimes.length - 1;
  for (let i = lastIdx; i >= 0; i--) {
    if ((dRain[i] || 0) >= 0.01 && daysSinceRain === null) daysSinceRain = lastIdx - i;
    if (lastIdx - i < 14) rain14 += dRain[i] || 0;
  }
  if (daysSinceRain === null) daysSinceRain = Math.min(31, lastIdx + 1); // dry the whole window

  // ---- recent high: hottest of the last 3 days incl. today
  let recentHighF = null;
  for (let i = Math.max(0, lastIdx - 2); i <= lastIdx; i++) {
    if (dTMax[i] != null) recentHighF = Math.max(recentHighF ?? -999, dTMax[i]);
  }

  // ---- next rain: first forward hour with >=0.02" or >=55% probability
  const hTimes = hourly.time || [];
  const hRain = hourly.precipitation || [];
  const hProb = hourly.precipitation_probability || [];
  const nowMs = new Date(nowISO).getTime();
  let hoursToRain = null;
  for (let i = 0; i < hTimes.length; i++) {
    const ms = new Date(hTimes[i]).getTime();
    if (ms < nowMs) continue;
    if ((hRain[i] || 0) >= 0.02 || (hProb[i] || 0) >= 55) {
      hoursToRain = Math.max(0, Math.round((ms - nowMs) / 3600000));
      break;
    }
  }

  const tempF = cur.temperature_2m;
  const rh = cur.relative_humidity_2m;
  const windMph = cur.wind_speed_10m;
  const gustMph = cur.wind_gusts_10m;
  const dT = deltaT_C(tempF, rh);
  const isDay = cur.is_day === 1;

  // ---- forecast: next 3 days
  const forecast = [];
  for (let i = lastIdx + 1; i < dTimes.length && forecast.length < 3; i++) {
    forecast.push({
      date: dTimes[i],
      hiF: dTMax[i],
      loF: (daily.temperature_2m_min || [])[i],
      rainIn: dRain[i],
      rainProb: (daily.precipitation_probability_max || [])[i],
      windMax: (daily.wind_speed_10m_max || [])[i]
    });
  }

  // ---- hourly spray-window: rate the next ~30 daylight-ish hours
  const hWind = hourly.wind_speed_10m || [];
  const hGust = hourly.wind_gusts_10m || [];
  const hTemp = hourly.temperature_2m || [];
  const hRh = hourly.relative_humidity_2m || [];
  const hDay = hourly.is_day || [];
  const hDir = hourly.wind_direction_10m || [];
  const hourlyWindow = [];
  for (let i = 0; i < hTimes.length && hourlyWindow.length < 33; i++) {
    const ms = new Date(hTimes[i]).getTime();
    if (ms < nowMs - 3600000) continue;
    const w = hWind[i], t = hTemp[i], rhh = hRh[i], pr = hRain[i] || 0, prob = hProb[i] || 0;
    const dt = deltaT_C(t, rhh);
    const day = hDay[i] === 1;
    let rating, reason;
    if (pr >= 0.02 || prob >= 55) { rating = "rain"; reason = `${prob}% rain`; }
    else if (w != null && w > 15) { rating = "poor"; reason = `wind ${Math.round(w)} mph`; }
    else if (w != null && w >= 10) { rating = "caution"; reason = `wind ${Math.round(w)} mph`; }
    else if (w != null && w < 2) { rating = "caution"; reason = day ? "dead calm — inversion risk" : "calm & dark"; }
    else if (dt != null && dt > 11) { rating = "caution"; reason = `Delta-T ${dt}`; }
    else if (t != null && t > 92) { rating = "caution"; reason = `${Math.round(t)}°F`; }
    else if (t != null && t < 50) { rating = "caution"; reason = `${Math.round(t)}°F`; }
    else if (!day) { rating = "caution"; reason = "after dark"; }
    else { rating = "good"; reason = `${w != null ? Math.round(w) + " mph" : ""}${dt != null ? ", Δt " + dt : ""}`.replace(/^, /, ""); }
    hourlyWindow.push({
      ms, label: hTimes[i].slice(11, 16), day,
      windMph: w != null ? Math.round(w) : null, gustMph: hGust[i] != null ? Math.round(hGust[i]) : null,
      dirCard: hDir[i] != null ? windCardinal(hDir[i]) : null,
      tempF: t != null ? Math.round(t) : null, rh: rhh != null ? Math.round(rhh) : null,
      deltaT: dt, rainProb: prob, rating, reason
    });
  }
  // best contiguous run of "good" hours
  let bestRun = null, run = null;
  hourlyWindow.forEach(hw => {
    if (hw.rating === "good") { run = run || { start: hw, end: hw, len: 0 }; run.end = hw; run.len++; }
    else { if (run && (!bestRun || run.len > bestRun.len)) bestRun = run; run = null; }
  });
  if (run && (!bestRun || run.len > bestRun.len)) bestRun = run;

  // ---- spray-timing flags (drift / evaporation / rainfastness / temperature)
  const flags = [];
  if (windMph != null) {
    if (windMph > 15)
      flags.push({ level: "danger", ref: "Wind", text: `Wind ${Math.round(windMph)} mph${gustMph ? `, gusting ${Math.round(gustMph)}` : ""} — over the ~10–15 mph ceiling on most labels. High drift risk toward surface water and sensitive crops. Wait for a calmer window.` });
    else if (windMph >= 10)
      flags.push({ level: "warn", ref: "Wind", text: `Wind ${Math.round(windMph)} mph out of the ${windCardinal(cur.wind_direction_10m)} — near the upper limit. OK for coarse droplets away from sensitive areas; hold off near water, gardens, or tree lines.` });
    else if (windMph < 3)
      flags.push({ level: "warn", ref: "Wind", text: `Wind only ${Math.round(windMph)} mph${isDay ? "" : " and it's not full daylight"} — dead calm can mean a temperature inversion that holds spray in a cloud and drifts it off-target. Spray once you can see steady leaf and flag movement (3–10 mph).` });
    else
      flags.push({ level: "info", ref: "Wind", text: `Wind ${Math.round(windMph)} mph out of the ${windCardinal(cur.wind_direction_10m)} — in the ideal 3–10 mph band for on-target coverage.` });
  }
  if (dT != null) {
    if (dT > 10) flags.push({ level: "warn", ref: "Delta-T", text: `Delta-T ${dT} — high evaporation. Fine droplets can dry before they reach the leaf; shift to early morning or evening.` });
    else if (dT < 2) flags.push({ level: "info", ref: "Delta-T", text: `Delta-T ${dT} — very humid, slow drying. Watch for long leaf wetness and runoff if you're close to water.` });
    else if (dT > 8) flags.push({ level: "info", ref: "Delta-T", text: `Delta-T ${dT} — marginal (ideal 2–8). Workable, but don't push the hottest part of the day.` });
    else flags.push({ level: "info", ref: "Delta-T", text: `Delta-T ${dT} — in the ideal 2–8 range for spray retention.` });
  }
  if (hoursToRain != null) {
    if (hoursToRain <= 6) flags.push({ level: "danger", ref: "Rain", text: `Rain likely in about ${hoursToRain} hr — most products need at least 4–6 rain-free hours (some 24). Wash-off and runoff to surface water are the likely result today.` });
    else if (hoursToRain <= 24) flags.push({ level: "warn", ref: "Rain", text: `Rain likely in about ${hoursToRain} hr — fine for fast-drying products, risky for anything needing a 24-hour rain-free window. Check the label before you mix.` });
  }
  if (tempF != null) {
    if (tempF < 60) flags.push({ level: "warn", ref: "Temp", text: `Currently ${Math.round(tempF)}°F — below 60°F many pasture herbicides act slowly on weeds that aren't actively growing. Warmer, sunny days work better.` });
    else if (tempF > 90) flags.push({ level: "warn", ref: "Temp", text: `Currently ${Math.round(tempF)}°F — above ~85–90°F, ester products (Remedy Ultra, PastureGard HL) can vaporize and drift. Use amine forms or wait for a cooler window.` });
  }
  if (daysSinceRain >= 21) flags.push({ level: "info", ref: "Drought", text: `${daysSinceRain}+ days since measurable rain — drought-stressed weeds take up herbicide poorly. Best results come after a soaking rain and a few days of green-up.` });

  return {
    place,
    fetchedAt: new Date().toISOString(),
    current: { tempF, rh, windMph, gustMph, dirDeg: cur.wind_direction_10m, dirCard: windCardinal(cur.wind_direction_10m), precipIn: cur.precipitation, isDay },
    deltaT: dT,
    recentHighF,
    daysSinceRain,
    rain14,
    hoursToRain,
    forecast,
    hourlyWindow,
    bestRun: bestRun ? { startMs: bestRun.start.ms, endMs: bestRun.end.ms + 3600000, len: bestRun.len } : null,
    flags
  };
}

function fmtHr(ms) {
  const h = new Date(ms).getHours();
  return ((h % 12) || 12) + (h < 12 ? " AM" : " PM");
}
// "7 AM" style, with a day tag when it's not today
function fmtHourMs(ms) {
  const d = new Date(ms);
  const today = new Date();
  const sameDay = d.toDateString() === today.toDateString();
  const tomorrow = new Date(today.getTime() + 86400000).toDateString() === d.toDateString();
  return (sameDay ? "" : tomorrow ? "tomorrow " : d.toLocaleDateString([], { weekday: "short" }) + " ") + fmtHr(ms);
}
function fmtTick(ms) {
  const h = new Date(ms).getHours();
  return h === 0 ? "12a" : h < 12 ? h + "a" : h === 12 ? "12p" : (h - 12) + "p";
}

async function getSprayWeather(zip) {
  const g = await geocodeZip(zip);
  const raw = await fetchOpenMeteo(g.lat, g.lon);
  return buildSprayWeather(g.place, raw);
}

// Pure recommendation engine — computes ranked herbicide matches for one field's
// context (weeds present, use type, water proximity, recent application history,
// today's conditions, and month). Called once per selected field so multi-field
// plans get per-field-accurate flags (water buffer, MOA rotation, timing).
function computeRecommendations({
  weeds,
  useType,
  nearWater,
  distToWater,
  applications,
  rainExpected,
  daysSinceRain,
  daysSinceCut,
  month,
  allowTimingOverride
}) {
  if (!weeds || weeds.length === 0) return {
    candidates: [],
    excludedByTiming: []
  };
  const recentMoaGroups = applications.slice().sort((a, b) => (b.date || "").localeCompare(a.date || "")).slice(0, 4).map(a => {
    const h = HERBICIDES.find(h => h.id === a.herbicideId);
    return h ? h.moa : null;
  }).filter(Boolean);
  const excludedByTiming = [];
  const isDormantMonth = DORMANT_MONTHS.includes(month);
  const candidates = HERBICIDES.map(h => {
    const hits = h.targets.filter(t => weeds.includes(t));
    if (hits.length === 0) return null;
    const useOk = useType === "both" ? h.use.includes("pasture") || h.use.includes("hay") : h.use.includes(useType);
    if (!useOk) return null;

    // Eligibility gate: a product whose timing prerequisite isn't met this month is
    // normally hidden (e.g. no broadcast glyphosate in August). With the override on,
    // it's shown instead with a hard warning so spot / wiper / dormant-method
    // applications are still possible.
    const timing = TIMING_RULES[h.id];
    let timingWarning = null;
    if (timing) {
      const prereqFailed = timing.requires === "dormant" && !isDormantMonth || timing.requires === "dormant-or-method" && !isDormantMonth || timing.requires === "active" && isDormantMonth;
      if (prereqFailed) {
        if (!allowTimingOverride) {
          excludedByTiming.push({
            id: h.id,
            name: h.name,
            reason: timing.note
          });
          return null;
        }
        timingWarning = timing.requires === "active"
          ? `Season-restricted (unlocked): the label wants 100% bermuda green-up before this goes on. Only run it once the grass is actively growing.`
          : `Season-restricted (unlocked): a broadcast pass now risks ${timing.note}. Keep it to a spot spray, a wick / wiper, a low rate on stubble right after a cutting, or wait for full dormancy.`;
      }
    }
    const flags = [];
    if (timingWarning) flags.push({ level: "danger", ref: "Season", text: timingWarning });
    if (nearWater && distToWater < h.waterBufferFt) {
      flags.push({
        level: "danger",
        ref: "Water buffer",
        text: `Water buffer: label calls for ~${h.waterBufferFt} ft from water; this field's profile has ${distToWater} ft to the nearest pond, creek, or lake.`
      });
    }
    if (recentMoaGroups.filter(m => m === h.moa).length >= 2) {
      flags.push({
        level: "warn",
        ref: "Resistance",
        text: `You've used MOA group ${h.moa} in ${recentMoaGroups.filter(m => m === h.moa).length} of this field's last 4 logged applications — consider rotating to a different mode of action to slow resistance.`
      });
    }
    if (h.restrictedUse) {
      flags.push({
        level: "warn",
        ref: "Registration",
        text: "Verify current registration/restricted-use status before applying — this product's labeled uses have shifted in recent years."
      });
    }
    if (h.manureMonths > 0) {
      flags.push({
        level: "warn",
        ref: "Carryover",
        text: `Aminopyralid carryover: don't give away or sell hay/manure from this field for ~${h.manureMonths} months — it can damage broadleaf crops/gardens wherever it ends up.`
      });
    }
    if (rainExpected) {
      flags.push({
        level: "warn",
        ref: "Rain",
        text: "Rain expected — most of these products want 4–6 hrs (some 24 hrs) rain-free after application to avoid wash-off and runoff to surface water."
      });
    }
    if (daysSinceRain !== "" && Number(daysSinceRain) > 21) {
      flags.push({
        level: "info",
        ref: "Drought",
        text: "Dry stretch (3+ weeks) — drought-stressed weeds absorb herbicide poorly. Consider waiting for a green-up or dropping the surfactant rate up slightly per label."
      });
    }
    // Post-cutting timing for the products whose sandbur/annual-grass value is tied to a hay cutting
    if ((h.id === "glyphosate" || h.id === "pastora" || h.id === "outrider") && (useType === "hay" || useType === "both") && daysSinceCut != null) {
      if (daysSinceCut <= 12) {
        flags.push({ level: "info", ref: "Post-cut", text: `This field was cut ~${daysSinceCut} day${daysSinceCut === 1 ? "" : "s"} ago — that's the window for ${h.id === "glyphosate" ? "a low glyphosate rate on the stubble for sandbur/annual grasses" : "this on regrowth sandbur (a low glyphosate rate mixed in helps)"}, before bermuda regrowth shields the weeds.` });
      } else if (daysSinceCut <= 25) {
        flags.push({ level: "info", ref: "Post-cut", text: `Cut ~${daysSinceCut} days ago — bermuda regrowth is coming back and starting to shield the weeds. The clean post-cutting shot has mostly passed for this field.` });
      }
    }
    // Annual per-acre label maximum, tallied from this field's logged applications this year
    const capOz = productLabelData(h.id).annualMaxOz;
    if (capOz != null) {
      const yr = String(new Date().getFullYear());
      const mid = (h.rateLowOz + h.rateHighOz) / 2;
      const passes = applications.filter(a => a.herbicideId === h.id && (a.date || "").slice(0, 4) === yr).length;
      if (passes > 0) {
        const usedOz = passes * mid;
        if (usedOz + mid > capOz + 0.001) {
          flags.push({ level: "danger", ref: "Annual max", text: `Annual max: this field's already had ~${usedOz.toFixed(1)} ${h.rateUnit} of this in ${yr} (${passes} pass${passes > 1 ? "es" : ""}); the label ceiling is ${capOz}. Another labeled-rate pass puts you over — don't.` });
        } else if (usedOz + mid > capOz - mid) {
          flags.push({ level: "warn", ref: "Annual max", text: `Annual max: ~${usedOz.toFixed(1)} of ${capOz} ${h.rateUnit} used on this field in ${yr}. Room for about one more pass at the label rate.` });
        }
      }
    }
    const score = hits.length * 10 - flags.filter(f => f.level === "danger").length * 100 - flags.filter(f => f.level === "warn").length * 2;
    return {
      herbicide: h,
      hits,
      flags,
      score
    };
  }).filter(Boolean);
  candidates.sort((a, b) => b.score - a.score);

  // Non-selective-only advisories: fired for weeds that have no selective option in
  // a bermuda/bahia stand, or where every eligible candidate this month is a
  // non-selective product anyway.
  const weedNotes = [];
  (weeds || []).forEach(wid => {
    const w = WEEDS.find(x => x.id === wid);
    const wName = w ? w.name : wid;
    if (NONSELECTIVE_ONLY[wid]) {
      weedNotes.push({ weed: wName, text: NONSELECTIVE_ONLY[wid] });
      return;
    }
    const forThis = candidates.filter(c => c.hits.includes(wid));
    if (forThis.length > 0 && forThis.every(c => NONSELECTIVE_IDS.has(c.herbicide.id))) {
      weedNotes.push({ weed: wName, text: `The only thing that matches ${wName} for this field right now is non-selective — it will hurt the bermuda too. Keep it to a spot / wiper application, a low rate on stubble right after a cutting, or a broadcast pass only during full grass dormancy.` });
    }
  });

  return {
    candidates,
    excludedByTiming,
    weedNotes
  };
}

/* ============================================================
   TANK MIX RULES ENGINE
   Grounded in: WALES/DALES mixing-order convention (VCE/Sprayers101/UNL
   extension guidance), the general label rule against tank-mixing two
   ALS-inhibitor (Group 2) products together (HSE / EPA label guidance),
   and specific documented combos from Corteva/university pasture-weed
   publications (Arkansas MP522/MP44, GrazonNext HL label). This is a
   planning aid, not a substitute for the specimen label of every
   product in the mix — the label always governs.
   ============================================================ */

// Active ingredients per product — so a mix that stacks the same a.i. across two
// premixes (2,4-D in Weedmaster + GrazonNext, picloram in Tordon + Surmount, etc.)
// gets caught even though the product names and MOA strings differ.
const HERB_ACTIVES = {
  "24d": ["2,4-D"], "grazonnext": ["aminopyralid", "2,4-D"], "milestone": ["aminopyralid"],
  "pasturegard": ["triclopyr", "fluroxypyr"], "remedyultra": ["triclopyr"],
  "pastora": ["metsulfuron", "nicosulfuron"], "glyphosate": ["glyphosate"], "imazapic": ["imazapic"],
  "pendimethalin": ["pendimethalin"], "indaziflam": ["indaziflam"], "paraquat": ["paraquat"],
  "cimarronplus": ["metsulfuron", "chlorsulfuron"], "outrider": ["sulfosulfuron"], "msma": ["MSMA"],
  "sedgehammer": ["halosulfuron"], "chaparral": ["aminopyralid", "metsulfuron"],
  "surmount": ["picloram", "fluroxypyr"], "dicamba24d": ["2,4-D", "dicamba"],
  "crossbow": ["2,4-D", "triclopyr"], "duracor": ["aminopyralid", "florpyrauxifen"],
  "terravue": ["aminopyralid", "metsulfuron"], "metsulfuron": ["metsulfuron"],
  "triclopyramine": ["triclopyr"], "fluroxypyr": ["fluroxypyr"], "quinclorac": ["quinclorac"],
  "grazonpd": ["picloram", "2,4-D"], "picloram": ["picloram"], "24db": ["2,4-DB"]
};
const INS_ACTIVES = {
  "chlorantraniliprole": ["chlorantraniliprole"], "methoxyfenozide": ["methoxyfenozide"],
  "spinosad": ["spinosad"], "lambdacy": ["lambda-cyhalothrin"], "zetacypermethrin": ["zeta-cypermethrin"],
  "bifenthrin": ["bifenthrin"], "carbaryl": ["carbaryl"], "dimilin": ["diflubenzuron"],
  "malathion": ["malathion"], "sivanto": ["flupyradifurone"],
  "fireantbait": ["methoprene", "hydramethylnon"], "besiege": ["lambda-cyhalothrin", "chlorantraniliprole"]
};
// active ingredients under a per-year cap where a double dose in one pass matters most
const LIMITED_ACTIVES = new Set(["2,4-D", "picloram", "aminopyralid", "dicamba", "triclopyr", "2,4-DB", "chlorantraniliprole", "MSMA"]);

function sharedActives(products, activesMap) {
  const seen = {};
  products.forEach(p => (activesMap[p.id] || []).forEach(a => { (seen[a] = seen[a] || []).push(p.name); }));
  return Object.keys(seen).filter(a => seen[a].length > 1).map(a => ({ active: a, products: [...new Set(seen[a])] }));
}
// pull group tokens like "3A", "28", "2" out of an IRAC/MOA string
function groupTokens(s) {
  return (String(s || "").match(/\b\d+[A-Z]?\b/g) || []);
}

// Chemical family per active — for the "two of the same family even if different
// actives" check (stacked pyridine auxins compete for the same detox pathway).
const RX_FAMILY = {
  "2,4-D": "phenoxy", "2,4-DB": "phenoxy", "MCPA": "phenoxy",
  "picloram": "pyridine-auxin", "aminopyralid": "pyridine-auxin", "clopyralid": "pyridine-auxin",
  "fluroxypyr": "pyridine-auxin", "triclopyr": "pyridine-auxin", "florpyrauxifen": "pyridine-auxin",
  "dicamba": "benzoic-auxin", "MSMA": "arsenical", "paraquat": "bipyridyl", "glyphosate": "glycine"
};

// Independent failsafe. Bright-line rules, first principles, no shared code with
// analyzeTankMix/analyzePestMix. Runs on the FINAL recommended mix; if the two
// checkers ever disagree, that disagreement is surfaced to the user.
function vetMix(products, kind) {
  const activesMap = kind === "pest" ? INS_ACTIVES : HERB_ACTIVES;
  const blocks = [];
  const reviews = [];
  if (!products || products.length < 2) return { ok: true, blocks, reviews };

  // 1. same active ingredient in two products
  const aCount = {};
  products.forEach(p => (activesMap[p.id] || []).forEach(a => { aCount[a] = (aCount[a] || 0) + 1; }));
  Object.keys(aCount).forEach(a => { if (aCount[a] > 1) blocks.push(`${a} would go on twice in one pass`); });

  // 2. site-of-action stacking
  const grp = {};
  products.forEach(p => groupTokens(kind === "pest" ? p.iracGroup : p.moa).forEach(g => { grp[g] = (grp[g] || 0) + 1; }));
  Object.keys(grp).forEach(g => {
    if (kind !== "pest" && g === "2" && grp[g] > 1) blocks.push(`two Group 2 (ALS) herbicides`);
    else if (kind !== "pest" && g === "4" && grp[g] > 2) blocks.push(`${grp[g]} Group 4 growth regulators`);
    else if (kind === "pest" && grp[g] > 1) reviews.push(`two products are IRAC group ${g}`);
  });

  // 3. same auxin family even if the active differs
  if (kind !== "pest") {
    const fam = {};
    products.forEach(p => (activesMap[p.id] || []).forEach(a => { const f = RX_FAMILY[a]; if (f && f.endsWith("auxin")) fam[f] = (fam[f] || 0) + 1; }));
    Object.keys(fam).forEach(f => { if (fam[f] > 1) reviews.push(`two ${f.replace(/-/g, " ")} products stacked`); });
  }

  // 4. non-selective / contact herbicide in a mix
  const nonsel = products.filter(p => ["glyphosate", "paraquat"].includes(p.id));
  if (nonsel.length) blocks.push(`${nonsel.map(p => p.name).join(", ")} is non-selective — don't tank-mix it on a stand you're keeping`);

  // 5. bait is not a tank partner
  const bait = products.filter(p => p.formulation === "bait");
  if (bait.length) blocks.push(`${bait.map(p => p.name).join(", ")} is a bait, not a tank-mix partner`);

  // 6. more products than a normal tank
  if (products.length > 3) reviews.push(`${products.length} products in one tank — real mixes rarely exceed three`);

  return { ok: blocks.length === 0, blocks, reviews };
}

const KNOWN_COMBOS = [{
  pair: ["grazonnext", "remedyultra"],
  level: "info",
  text: "GrazonNext HL + Remedy Ultra is a well-documented, picloram-free one-pass broadleaf + brush combo used in university pasture-weed guides."
}, {
  pair: ["grazonnext", "pasturegard"],
  level: "info",
  text: "GrazonNext HL + PastureGard HL is called out on the GrazonNext label itself as an effective tank-mix partner for one-pass weed and brush control."
}, {
  pair: ["chaparral", "pasturegard"],
  level: "info",
  text: "Chaparral + PastureGard HL is a commonly recommended combo for tougher brush like buckbrush."
}, {
  pair: ["grazonnext", "pastora"],
  level: "info",
  text: "GrazonNext HL + Pastora is a labeled, commonly used combination for broader broadleaf + johnsongrass control in hay fields."
}, {
  pair: ["msma", "24d"],
  level: "warn",
  text: "MSMA + 2,4-D is a workable, commonly used combo, but MSMA performs best above ~70°F — a cool-weather application can underperform on the target weed while still stressing the bermuda."
}, {
  pair: ["pastora", "glyphosate"],
  level: "info",
  text: "Pastora + a low rate of glyphosate (roughly 6–8 fl oz/ac of a 4 lb/gal formulation) is a university-documented combo for perennial/regrowth sandbur and vaseygrass that Pastora alone won't fully knock back — it stunts bermuda more than Pastora alone, so time it right after a cutting."
}];
function analyzeTankMix(selected) {
  const flags = [];
  const ids = selected.map(h => h.id);

  // Rule: don't stack two ALS (Group 2) inhibitors in one mix.
  const alsProducts = selected.filter(h => groupTokens(h.moa).includes("2"));
  if (alsProducts.length >= 2) {
    flags.push({
      level: "danger",
      text: `${alsProducts.map(h => h.name).join(" + ")} are ${alsProducts.length > 2 ? "all" : "both"} Group 2 (ALS-inhibitor) products. Labels generally restrict tank-mixing or sequencing two ALS herbicides together, and it stacks resistance-selection pressure on the same site of action. Don't combine these unless a current label explicitly allows it.`
    });
  }

  // Same active ingredient in two products (usually two premixes) — double dose in
  // one pass, over the annual limit for that a.i., and needless crop injury.
  sharedActives(selected, HERB_ACTIVES).forEach(s => {
    flags.push({
      level: LIMITED_ACTIVES.has(s.active) ? "danger" : "warn",
      text: `${s.products.join(" and ")} both contain ${s.active} — mixing them applies it twice in one pass.${LIMITED_ACTIVES.has(s.active) ? ` That stacks toward the annual per-acre limit on ${s.active} and adds crop injury for no extra spectrum.` : " Redundant — pick one."} Drop one of them.`
    });
  });

  // Three or more synthetic-auxin (Group 4) growth regulators in one tank
  const auxins = selected.filter(h => groupTokens(h.moa).includes("4"));
  if (auxins.length >= 3) {
    flags.push({
      level: "warn",
      text: `${auxins.length} Group 4 growth-regulator herbicides in one tank (${auxins.map(h => h.name).join(", ")}) is a heavy auxin load on the bermuda and invites antagonism between them. Two auxins is usually the practical ceiling — most broadleaf spectrum is already covered by then.`
    });
  }

  // MSMA — the current label only supports tank-mixing it with 2,4-D
  if (ids.includes("msma") && selected.length > 1) {
    const others = ids.filter(x => x !== "msma");
    if (!(others.length === 1 && others[0] === "24d")) {
      flags.push({
        level: "warn",
        text: `MSMA's remaining label allows very few tank-mix partners — 2,4-D is the documented one. Mixing it with ${selected.filter(h => h.id !== "msma").map(h => h.name).join(", ")} isn't supported; check the specimen label before you combine.`
      });
    }
  }

  // Paraquat — fast contact burndown, antagonises any systemic partner
  if (ids.includes("paraquat") && selected.length > 1) {
    flags.push({
      level: "danger",
      text: "Paraquat is a fast contact desiccant — it burns leaf tissue down before a systemic partner in the same tank can translocate, so it cuts the systemic's kill. It's also non-selective on any green bermuda. Apply paraquat on its own, during dormancy."
    });
  }

  // Quinclorac (Facet L) grass-control antagonism from auxin partners
  if (ids.includes("quinclorac") && selected.some(h => h.id !== "quinclorac" && groupTokens(h.moa).includes("4"))) {
    flags.push({
      level: "warn",
      text: "Quinclorac (Facet L) grass control is antagonised by 2,4-D and dicamba in the same tank — the Facet label calls for a MSO/COC adjuvant and, ideally, separating it from those partners. Watch the grass activity if you keep them together."
    });
  }

  // Known documented combos (good or cautionary)
  KNOWN_COMBOS.forEach(c => {
    if (c.pair.every(id => ids.includes(id))) flags.push({
      level: c.level,
      text: c.text
    });
  });

  // Glyphosate is non-selective — flag it outside the one documented Pastora combo
  if (ids.includes("glyphosate")) {
    const documented = ids.includes("pastora") && selected.length === 2;
    if (!documented) {
      flags.push({
        level: "danger",
        text: "Glyphosate is non-selective — it will damage or kill bermuda along with whatever else is in this mix, regardless of what else you're tank-mixing it with. Outside the specific Pastora + low-rate-glyphosate combo, adding glyphosate to a mix usually isn't what you want on a stand you're trying to keep."
      });
    }
  }

  // Restricted-use inheritance
  const ru = selected.filter(h => h.restrictedUse);
  if (ru.length > 0) {
    flags.push({
      level: "warn",
      text: `${ru.map(h => h.name).join(", ")} ${ru.length > 1 ? "are" : "is"} restricted-use — verify registration status and applicator licensing before mixing, same as spraying it alone.`
    });
  }

  // Manure/hay carryover inheritance — worst case governs the whole batch
  const carry = selected.filter(h => h.manureMonths > 0);
  if (carry.length > 0) {
    const months = Math.max(...carry.map(h => h.manureMonths));
    const acts = new Set(carry.flatMap(h => (HERB_ACTIVES[h.id] || []).filter(a => ["aminopyralid", "picloram", "quinclorac"].includes(a))));
    const label = [...acts].join(" / ") || "residual growth-regulator";
    flags.push({
      level: "warn",
      text: `${carry.map(h => h.name).join(", ")} — ${label} hay / manure / plant-back restriction (~${months} months). Because it's in the mix, the WHOLE batch of hay or manure off this field inherits the longest one, even the parts from the other products.`
    });
  }

  // Most restrictive water buffer / grazing / hay govern the mix as a whole
  const buffer = Math.max(...selected.map(h => h.waterBufferFt));

  // Mixing order per WALES/DALES: dry → water-soluble liquid → EC/ester → surfactant
  const order = {
    dry: selected.filter(h => h.formulation === "dry"),
    soluble: selected.filter(h => h.formulation === "soluble"),
    ec: selected.filter(h => h.formulation === "ec")
  };
  flags.forEach(f => { if (!f.ref) f.ref = "Tank mix"; });
  return {
    flags,
    buffer,
    order
  };
}

// weed/soil inputs — these get an automatic timing note (mirrors TIMING_RULES).
const PEST_SEASON = {
  fallarmyworm: { months: ["July", "August", "September", "October"], note: "fall armyworm flights run mid-summer into fall across the Southeast — scout new growth and fields after a cutting" },
  truearmyworm: { months: ["April", "May", "June", "September"], note: "true armyworm is a spring/early-summer and again early-fall pest" },
  stemmaggot: { months: ["July", "August", "September"], note: "stem maggot damage shows up in mid to late summer on regrowth after a cutting" },
  aphid: { months: ["March", "April", "May", "September", "October", "November"], note: "aphids build in the cooler shoulder seasons, not the heat of summer" },
};

// Pulls the worst-case (largest) number of days out of a PHI string like "14 days",
// "0–30 days by rate", or "40-day cutting restriction" — parseInt alone would grab
// only the first number ("0" out of "0–30 days by rate"), silently hiding the
// higher end of a rate-dependent restriction. Returns 0 for non-numeric text like
// "Check current label — varies" (a safe-but-uninformative fallback, not a claim
// that the restriction is actually zero).
function phiDays(str) {
  if (str == null) return 0;
  const nums = String(str).match(/\d+/g);
  if (!nums) return 0;
  return Math.max(...nums.map(Number));
}

/* ============================================================
   RECORDS / RESTRICTIONS / BACKUP  (built on the application log)
   ============================================================ */

function productById(id) {
  return HERBICIDES.find(p => p.id === id) || INSECTICIDES.find(p => p.id === id) || null;
}
function shortProductName(name) {
  return String(name || "").replace(/\s*\(e\.g\.\s*[^)]*\)/i, "").trim();
}
function todayISO() { return new Date().toISOString().slice(0, 10); }
function shiftISO(dateStr, { days = 0, months = 0 }) {
  const d = new Date((dateStr || todayISO()) + "T12:00:00");
  if (months) d.setMonth(d.getMonth() + months);
  if (days) d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}
function daysBetween(aISO, bISO) {
  return Math.round((Date.parse(bISO + "T12:00:00") - Date.parse(aISO + "T12:00:00")) / 86400000);
}
function isProhibitedText(str) {
  return /\bdo not\b[^.]*\b(cut|hay|graze|pasture|mow)/i.test(String(str || ""));
}
function isVagueText(str) {
  return /varies|check|label|current/i.test(String(str || "")) && phiDays(str) === 0 && !isProhibitedText(str);
}

// Per-field: what's still under a grazing / hay / carryover restriction, and until when.
function computeFieldRestrictions(fieldName, applications, refISO) {
  const ref = refISO || todayISO();
  const apps = (applications || []).filter(a => a.field === fieldName && a.date && a.herbicideId !== "fertilizer");
  const rows = [];
  apps.forEach(a => {
    const p = productById(a.herbicideId);
    if (!p) return;
    [["graze", p.grazing], ["hay", p.hay]].forEach(([kind, txt]) => {
      if (isProhibitedText(txt)) {
        rows.push({ kind, product: p.name, date: a.date, prohibited: true, text: txt });
      } else {
        const d = phiDays(txt);
        const vague = isVagueText(txt);
        if (d > 0) {
          rows.push({ kind, product: p.name, date: a.date, until: shiftISO(a.date, { days: d }), days: d });
        } else if (vague) {
          // no fixed interval on the label text — keep a ~6-week reminder window to go check it
          rows.push({ kind, product: p.name, date: a.date, until: shiftISO(a.date, { days: 45 }), days: 0, vague: true });
        }
      }
    });
    if (p.manureMonths > 0) {
      rows.push({ kind: "carryover", product: p.name, date: a.date, until: shiftISO(a.date, { months: p.manureMonths }), months: p.manureMonths });
    }
  });
  function summarize(kind) {
    const list = rows.filter(r => r.kind === kind);
    const prohibited = list.filter(r => r.prohibited);
    const stillActive = list.filter(r => r.until && r.until > ref);
    const latest = stillActive.slice().sort((x, y) => x.until.localeCompare(y.until)).pop() || null;
    return {
      prohibited: prohibited.length ? prohibited : null,
      until: latest ? latest.until : null,
      product: latest ? latest.product : null,
      vague: latest ? !!latest.vague : false,
      date: latest ? latest.date : null,
      daysLeft: latest ? daysBetween(ref, latest.until) : 0
    };
  }
  const graze = summarize("graze");
  const hay = summarize("hay");
  const carry = summarize("carryover");
  return {
    graze, hay, carry,
    hasAny: !!(graze.prohibited || graze.until || hay.prohibited || hay.until || carry.until),
    rows
  };
}

  if (!p || cap == null) return null;
  const y = String(year || new Date().getFullYear());
  const mid = (p.rateLowOz + p.rateHighOz) / 2;
  const used = (applications || []).filter(a =>
    a.field === fieldName && a.herbicideId === productId && (a.date || "").slice(0, 4) === y
  );
  const usedOz = used.length * mid;
  return {
    count: used.length,
    usedOz,
    cap,
    remainingOz: cap - usedOz,
    unit: p.rateUnit,
    nextWouldExceed: usedOz + mid > cap + 0.001,
    atCap: usedOz >= cap - 0.001,
    year: y
  };
}

async function exportAllData() {
  const listed = await window.storage.list("spray-planner:");
  const keys = (listed && listed.keys) || [];
  const data = {};
  for (const k of keys) {
    const r = await window.storage.get(k);
    if (!r) continue;
    try { data[k] = JSON.parse(r.value); } catch (e) { data[k] = r.value; }
  }
  return { app: "SprayPlan", schema: 1, exportedAt: new Date().toISOString(), data };
}
async function importAllData(obj) {
  if (!obj || obj.app !== "SprayPlan" || !obj.data || typeof obj.data !== "object") {
    throw new Error("That doesn't look like a SprayPlan backup file.");
  }
  let n = 0;
  for (const k of Object.keys(obj.data)) {
    if (!k.startsWith("spray-planner:")) continue;
    await window.storage.set(k, JSON.stringify(obj.data[k]));
    n++;
  }
  return n;
}
function downloadTextFile(filename, text, mime) {
  try {
    const blob = new Blob([text], { type: mime || "application/octet-stream" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return true;
  } catch (e) {
    return false;
  }
}
function csvCell(v) {
  const s = v == null ? "" : String(v);
  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

// Snapshot of the conditions at log time, stamped onto each application entry so
// the printable record isn't reconstructed from stale field/weather data later.
function recordSnapshot(profile, weather, sprayerSettings) {
  const c = weather && weather.current ? weather.current : null;
  const parts = [];
  if (c && c.windMph != null) parts.push(`wind ${Math.round(c.windMph)} mph${c.dirCard ? " " + c.dirCard : ""}`);
  if (c && c.tempF != null) parts.push(`${Math.round(c.tempF)}°F`);
  if (c && c.rh != null) parts.push(`${Math.round(c.rh)}% RH`);
  return {
    acres: Number(profile && profile.acreage) > 0 ? Number(profile.acreage) : null,
    windMph: c && c.windMph != null ? Math.round(c.windMph) : null,
    windDir: c ? c.dirCard || null : null,
    tempF: c && c.tempF != null ? Math.round(c.tempF) : null,
    conditions: parts.join(", "),
    appliedBy: (sprayerSettings && sprayerSettings.applicatorName) || ""
  };
}

// One normalized row per logged pesticide application, for the printable / CSV record.
function sprayRecordRows(applications, fieldProfiles, opts) {
  const rupOnly = opts && opts.rupOnly;
  return (applications || [])
    .filter(a => a.category === "herbicide" || a.category === "insecticide" ||
      (a.category == null && a.herbicideId !== "fertilizer" && productById(a.herbicideId)))
    .map(a => {
      const p = productById(a.herbicideId);
      const ld = productLabelData(a.herbicideId);
      const prof = (fieldProfiles && fieldProfiles[a.field]) || {};
      const targets = (a.weeds || a.pests || []).map(id =>
        (WEEDS.find(w => w.id === id) || PESTS.find(x => x.id === id) || {}).name).filter(Boolean).join("; ");
      return {
        date: a.date || "",
        field: a.field || "",
        acres: a.acres != null ? a.acres : (Number(prof.acreage) > 0 ? Number(prof.acreage) : ""),
        product: a.herbicideName || (p ? p.name : a.herbicideId),
        epaReg: ld.epaReg || "",
        rate: a.rate || (p ? p.rate : ""),
        target: targets || (a.category === "insecticide" ? "insect pest" : "weeds"),
        restricted: p ? !!p.restrictedUse : false,
        applicator: a.appliedBy || "",
        conditions: a.conditions || [a.windMph != null ? `wind ${a.windMph}${a.windDir ? " " + a.windDir : ""} mph` : "", a.tempF != null ? `${a.tempF}°F` : ""].filter(Boolean).join(", ")
      };
    })
    .filter(r => !rupOnly || r.restricted)
    .sort((x, y) => (y.date || "").localeCompare(x.date || ""));
}
function buildSprayRecordCSV(rows) {
  const head = ["Date", "Field", "Acres treated", "Product", "EPA Reg. No.", "Rate", "Target pest", "Restricted use", "Applicator", "Wind / temp"];
  const lines = [head.map(csvCell).join(",")];
  rows.forEach(r => lines.push([r.date, r.field, r.acres, r.product, r.epaReg, r.rate, r.target, r.restricted ? "YES" : "", r.applicator, r.conditions].map(csvCell).join(",")));
  return lines.join("\n");
}

function computePestControl({ pests, useType, nearWater, distToWater, applications, rainExpected, daysSinceRain, daysSinceCut, month, weather }) {
  if (!pests || pests.length === 0) return { candidates: [], excludedByTiming: [] };
  const recentGroups = applications
    .slice()
    .sort((a, b) => (b.date || "").localeCompare(a.date || ""))
    .slice(0, 4)
    .map(a => {
      const p = INSECTICIDES.find(x => x.id === a.herbicideId);
      return p ? p.iracGroup : null;
    })
    .filter(Boolean);
  const windMph = weather && weather.current ? weather.current.windMph : null;
  const excludedByTiming = [];
  const candidates = INSECTICIDES.map(p => {
    const hits = p.targets.filter(t => pests.includes(t));
    if (hits.length === 0) return null;
    const useOk = useType === "both" ? p.use.includes("pasture") || p.use.includes("hay") : p.use.includes(useType);
    if (!useOk) return null;

    const flags = [];
    if (nearWater && distToWater < p.waterBufferFt) {
      flags.push({ level: "danger", ref: "Water buffer", text: `Water buffer: this product's label calls for ~${p.waterBufferFt} ft from water and it's toxic to aquatic life; this field's profile has ${distToWater} ft to the nearest pond, creek, or lake.` });
    }
    if (windMph != null && windMph > 10) {
      flags.push({ level: windMph > 15 ? "danger" : "warn", ref: "Wind", text: `Wind is ${Math.round(windMph)} mph right now — insecticide drift onto surface water, gardens, or a neighbor's bees is the risk. Spray under 10 mph.` });
    }
    if (recentGroups.filter(g => g === p.iracGroup).length >= 2) {
      flags.push({ level: "warn", ref: "Resistance", text: `IRAC group ${p.iracGroup} shows up in ${recentGroups.filter(g => g === p.iracGroup).length} of this field's last 4 logged sprays — rotate to a different group. (Note: all pyrethroids are group 3A — switching brands isn't rotating.)` });
    }
    if (p.iracGroup.startsWith("3A") && hits.some(h => h === "fallarmyworm" || h === "truearmyworm")) {
      flags.push({ level: "warn", ref: "Resistance", text: "Fall armyworm has documented pyrethroid (group 3A) resistance across much of the South — a pyrethroid can give a poor kill on a heavy flight. A diamide (Prevathon) or IGR is the more reliable choice on worms." });
    }
    if (p.restrictedUse) {
      flags.push({ level: "warn", ref: "Registration", text: "Restricted-use pesticide — applicator license required. Verify current registration before buying." });
    }
    if (p.beeTox === "high") {
      flags.push({ level: "warn", ref: "Bees", text: "Highly toxic to bees. Don't spray blooming clover, vetch, or flowering weeds, and stay off during foraging hours — spray at dusk or after dark and let it dry." });
    } else if (p.beeTox === "moderate") {
      flags.push({ level: "info", ref: "Bees", text: "Toxic to bees while the spray is wet; dries safe within a few hours. Spray in the evening if there's blooming cover in the stand." });
    }
    if (phiDays(p.grazing) > 0 || phiDays(p.hay) > 0) {
      flags.push({ level: "info", ref: "Pre-harvest", text: `Pre-harvest interval: ${p.grazing} before grazing, ${p.hay} before cutting hay. Restricted-entry ${p.rei} hr.` });
    }
    if (rainExpected && p.formulation !== "bait") {
      flags.push({ level: "warn", ref: "Rain", text: "Rain in the forecast — this needs a few hours dry on the plant to work; a wash-off means re-treating." });
    }
    if (p.formulation === "bait" && daysSinceRain !== "" && Number(daysSinceRain) < 1) {
      flags.push({ level: "warn", ref: "Bait timing", text: "Ground is wet — fire ant bait molds and ants ignore it. Wait for a dry, warm stretch with ants actively foraging." });
    }
    if (hits.includes("grasshopper") && daysSinceRain !== "" && Number(daysSinceRain) > 21) {
      flags.push({ level: "info", ref: "Scouting", text: "Grasshopper numbers climb in drought and they move in from field margins and ditches — treating a border strip early, while nymphs are small, beats a whole-field rescue spray later." });
    }
    if (hits.includes("stemmaggot") && daysSinceCut != null) {
      if (daysSinceCut >= 5 && daysSinceCut <= 14) {
        flags.push({ level: "info", ref: "Post-cut", text: `This field was cut ~${daysSinceCut} days ago — 7–10 days after a cutting, as regrowth greens up, is the stem maggot spray window. You're in it.` });
      } else if (daysSinceCut < 5) {
        flags.push({ level: "info", ref: "Post-cut", text: `Only ~${daysSinceCut} days since the cutting — let the regrowth get up a few more days before spraying for stem maggot.` });
      }
    }
    if ((hits.includes("fallarmyworm") || hits.includes("truearmyworm")) && daysSinceCut != null && daysSinceCut <= 16) {
      flags.push({ level: "info", ref: "Post-cut", text: `Fresh regrowth after a cutting (~${daysSinceCut} days) is prime armyworm feeding — walk the greening-up field and check for worms before they get ahead of you.` });
    }
    const capOz = productLabelData(p.id).annualMaxOz;
    if (capOz != null) {
      const yr = String(new Date().getFullYear());
      const mid = (p.rateLowOz + p.rateHighOz) / 2;
      const passes = applications.filter(a => a.herbicideId === p.id && (a.date || "").slice(0, 4) === yr).length;
      if (passes > 0) {
        const usedOz = passes * mid;
        if (usedOz + mid > capOz + 0.001) {
          flags.push({ level: "danger", ref: "Annual max", text: `Annual max: ~${usedOz.toFixed(1)} ${p.rateUnit} of this already on the field in ${yr} (${passes} pass${passes > 1 ? "es" : ""}); label ceiling ${capOz}. Another pass at the label rate is over the limit.` });
        } else if (usedOz + mid > capOz - mid) {
          flags.push({ level: "warn", ref: "Annual max", text: `Annual max: ~${usedOz.toFixed(1)} of ${capOz} ${p.rateUnit} used this year — about one pass left.` });
        }
      }
    }

    const score = hits.length * 10
      - flags.filter(f => f.level === "danger").length * 100
      - flags.filter(f => f.level === "warn").length * 2
      + (p.beeTox === "low" ? 2 : 0)
      + (p.iracGroup.startsWith("28") || p.iracGroup.startsWith("18") ? 3 : 0);
    return { herbicide: p, hits, flags, score };
  }).filter(Boolean);

  // season timing note (soft — shown, not excluded, since scouting overrides the calendar)
  pests.forEach(pid => {
    const s = PEST_SEASON[pid];
    if (s && !s.months.includes(month)) {
      const pest = PESTS.find(x => x.id === pid);
      excludedByTiming.push({ id: pid, name: pest ? pest.name : pid, reason: s.note });
    }
  });

  candidates.sort((a, b) => b.score - a.score);
  return { candidates, excludedByTiming };
}

  { id: "tsp", name: "Triple superphosphate", analysis: "0-46-0", form: "dry", pPct: 46, note: "Dry straight phosphate with no nitrogen — the P source when you don't want the extra N that comes with DAP or MAP." },
  { id: "blend171717", name: "Complete blend", analysis: "17-17-17", form: "dry", blend: true, nPct: 17, pPct: 17, kPct: 17, note: "A balanced starting blend when a soil test shows all three low; usually cheaper to buy N, P, K separately once you know the real ratio." },
  { id: "blend15515", name: "Hay blend", analysis: "15-5-15 (typical)", form: "dry", blend: true, nPct: 15, pPct: 5, kPct: 15, note: "Roughly matches what a ton of bermuda hay removes — a reasonable custom blend spec for a maintenance hay-field application." },
  { id: "poultrylitter", name: "Broiler / poultry litter", analysis: "~3-3-3 (test your source)", form: "dry", blend: true, litter: true, nPct: 1.7, pPct: 2.8, kPct: 2.5, sPct: 0.5, note: "The dominant organic fertility source across the Southeast — cheap where it's local, and it builds organic matter. Book value is roughly 55–65 lb total N, 55–60 lb P₂O₅, and 45–55 lb K₂O per ton, but only about half the N is available the first year and every load is different, so a litter analysis is worth it. It's P-heavy relative to what grass removes, so repeated use runs soil-test P up — watch it near ponds and creeks." },
  { id: "boron", name: "Boron (Solubor / borate)", analysis: "20% B (Solubor)", form: "both", note: "Bermuda hay pulls ~0.3–0.5 lb B/ton; sandy, low-organic-matter soils run short. ~1–2 lb actual B/ac/yr, or 5–10 lb Solubor. Boron's margin between deficient and toxic is narrow — never exceed the label rate, and don't band it." },
  { id: "gypsum", name: "Gypsum (calcium sulfate)", analysis: "~17% Ca, ~13% S", form: "dry", sPct: 13, note: "Supplies sulfur and calcium without changing pH — the S source for fields that already test at a good pH and don't need lime. Also loosens tight, sodium-affected bottomland soils. Not a liming material." },
];

function lbToTons(lb) { return Math.round((lb / 2000) * 100) / 100; }

// Break a fertilizer product + rate into per-acre nutrient amounts from its analysis.
function deriveFertNutrients(product, ratePerAc) {
  if (!product || !(ratePerAc > 0)) return [];
  if (product.id === "aglime" || product.id === "pellime") return [{ n: "Lime", perAcre: Math.round(ratePerAc * 10) / 10, unit: "tons/ac" }];
  const lbPerAc = product.form === "liquid" && product.lbPerGal ? ratePerAc * product.lbPerGal : ratePerAc;
  const out = [];
  [["N", product.nPct], ["P₂O₅", product.pPct], ["K₂O", product.kPct], ["S", product.sPct]].forEach(pair => {
    if (pair[1] > 0) out.push({ n: pair[0], perAcre: Math.round(lbPerAc * (pair[1] / 100) * 10) / 10, unit: "lb/ac" });
  });
  return out;
}

/* ---- Fertilizer batch planning: apply toward an annual target, count logged passes ---- */
const FERT_NUT_KEYS = ["N", "P₂O₅", "K₂O", "S", "Lime"];
// full name + chemical symbol, e.g. "Nitrogen (N)" — used for headings, labels, and flag references
const NUTRIENT_NAMES = { "N": "Nitrogen (N)", "P₂O₅": "Phosphorus (P₂O₅)", "K₂O": "Potassium (K₂O)", "S": "Sulfur (S)", "Lime": "Lime" };
function nutrientLabel(nut) { return NUTRIENT_NAMES[nut] || nut; }
function fertYear() { return new Date().getFullYear(); }

// Sum every logged fertilizer application's per-acre nutrient amounts for one field
// this calendar year. Entries with no nutrient breakdown are counted separately.
function fertAppliedForField(applications, fieldName) {
  const applied = {};
  let uncounted = 0;
  (applications || []).forEach(a => {
    if (a.category !== "fertilizer" || a.field !== fieldName) return;
    if (Number(String(a.date || "").slice(0, 4)) !== fertYear()) return;
    const nuts = a.nutrients || [];
    if (!nuts.length) { uncounted += 1; return; }
    nuts.forEach(n => {
      const v = Number(n.perAcre != null ? n.perAcre : n.rate) || 0;
      applied[n.n] = (applied[n.n] || 0) + v;
    });
  });
  return { applied, uncounted };
}

// One primary product to deliver a nutrient at a given lb/ac (or tons/ac for lime).
function fertProductForNutrient(nutrient, perAcre, form) {
  if (!(perAcre > 0)) return null;
  const P = id => FERT_PRODUCTS.find(x => x.id === id);
  if (nutrient === "N") {
    const p = form === "liquid" ? P("uan32") : P("urea");
    return form === "liquid"
      ? { nutrient, product: p, perAcre: Math.round((perAcre / p.nLbPerGal) * 10) / 10, unit: "gal/ac" }
      : { nutrient, product: p, perAcre: Math.round(perAcre / (p.nPct / 100)), unit: "lb/ac" };
  }
  if (nutrient === "P₂O₅") {
    const p = form === "liquid" ? P("map1034") : P("tsp");
    return form === "liquid"
      ? { nutrient, product: p, perAcre: Math.round((perAcre / (p.pPct / 100)) / 11 * 10) / 10, unit: "gal/ac" }
      : { nutrient, product: p, perAcre: Math.round(perAcre / (p.pPct / 100)), unit: "lb/ac" };
  }
  if (nutrient === "K₂O") { const p = P("potash"); return { nutrient, product: p, perAcre: Math.round(perAcre / (p.kPct / 100)), unit: "lb/ac" }; }
  if (nutrient === "S") { const p = P("ammsulfate"); return { nutrient, product: p, perAcre: Math.round(perAcre / (p.sPct / 100)), unit: "lb/ac" }; }
  if (nutrient === "Lime") { const p = P("aglime"); return { nutrient, product: p, perAcre: Math.round(perAcre * 10) / 10, unit: "tons/ac" }; }
  return null;
}

function splitFertCart(items) {
  const groups = [];
  const isLime = i => i.nutrient === "Lime" || (i.product && i.product.analysis === "pH");
  const dry = items.filter(i => !isLime(i) && i.product.form !== "liquid");
  const liq = items.filter(i => !isLime(i) && i.product.form === "liquid");
  const lime = items.filter(isLime);
  if (dry.length) groups.push({ label: "Dry — one spreader pass", items: dry });
  if (liq.length) groups.push({ label: "Liquid — through the sprayer", items: liq });
  if (lime.length) groups.push({ label: "Lime — its own pass, ahead of the rest", items: lime });
  return groups;
}

/* ---- User-chosen fertilizer products (works like the weed/pest product picker) ---- */

// Products that can supply a nutrient. Blends and litter show under every macro.
function fertProductsForNutrient(nutrient, form) {
  if (nutrient === "Lime") return FERT_PRODUCTS.filter(p => p.analysis === "pH");
  const key = { "N": "nPct", "P₂O₅": "pPct", "K₂O": "kPct", "S": "sPct" }[nutrient];
  return FERT_PRODUCTS.filter(p => {
    if (p.analysis === "pH" || !(p[key] > 0)) return false;
    if (form === "dry" && p.form === "liquid") return false;
    if (form === "liquid" && p.form === "dry" && !p.blend && p.id !== "potash" && p.id !== "sop") return false;
    return true;
  });
}

// The engine's default pick per nutrient — the "recommended set" the user then swaps.
function recommendedFertSet(fertNeeds, form) {
  const sel = {};
  if (fertNeeds.n) sel["N"] = form === "liquid" ? "uan32" : "urea";
  if (fertNeeds.p) sel["P₂O₅"] = form === "liquid" ? "map1034" : "dap";
  if (fertNeeds.k) sel["K₂O"] = "potash";
  if (fertNeeds.s) sel["S"] = "ammsulfate";
  if (fertNeeds.lime) sel["Lime"] = "aglime";
  return sel;
}

// Nutrients one product + rate delivers (rate: lb/ac dry, gal/ac liquid, tons/ac lime).
function fertDelivers(product, ratePerAc) {
  if (!product || !(ratePerAc > 0)) return {};
  if (product.analysis === "pH") return { "Lime": ratePerAc };
  const lb = product.form === "liquid" && product.lbPerGal ? ratePerAc * product.lbPerGal : ratePerAc;
  const out = {};
  if (product.nPct > 0) out["N"] = lb * product.nPct / 100;
  if (product.pPct > 0) out["P₂O₅"] = lb * product.pPct / 100;
  if (product.kPct > 0) out["K₂O"] = lb * product.kPct / 100;
  if (product.sPct > 0) out["S"] = lb * product.sPct / 100;
  return out;
}
function fertUnitFor(p) { return p.analysis === "pH" ? "tons/ac" : (p.form === "liquid" ? "gal/ac" : "lb/ac"); }

// Rate of a product to hit `amt` of `nutrient`.
function fertRateFor(product, nutrient, amt) {
  if (!product || !(amt > 0)) return 0;
  if (nutrient === "Lime" || product.analysis === "pH") return Math.round(amt * 10) / 10;
  const pct = { "N": product.nPct, "P₂O₅": product.pPct, "K₂O": product.kPct, "S": product.sPct }[nutrient];
  if (!(pct > 0)) return 0;
  if (product.form === "liquid" && product.lbPerGal) return Math.round((amt / (pct / 100) / product.lbPerGal) * 10) / 10;
  return Math.round(amt / (pct / 100));
}

// Given nutrient targets + a per-nutrient product selection, return the product
// amounts that hit them, crediting cross-contributions (DAP's N, etc.). `fixed`
// = { productId: rate } for products whose rate the user set directly (blends).
function solveFertCart(targets, selections, form, fixed) {
  const RANK = { "P₂O₅": 0, "K₂O": 1, "S": 2, "N": 3, "Lime": 4 };
  const delivered = { N: 0, "P₂O₅": 0, "K₂O": 0, S: 0, Lime: 0 };
  const items = [];
  // group nutrients by the product chosen for them (one product may cover several)
  const byProduct = {};
  Object.keys(selections || {}).forEach(nut => {
    const pid = selections[nut];
    if (!pid || !((targets[nut] || 0) > 0)) return;
    (byProduct[pid] = byProduct[pid] || []).push(nut);
  });
  // fixed-rate products (blends the user rate-set) go in first, at their set rate
  Object.keys(fixed || {}).forEach(pid => {
    const p = FERT_PRODUCTS.find(x => x.id === pid);
    if (!p || !(fixed[pid] > 0)) return;
    const d = fertDelivers(p, fixed[pid]);
    Object.keys(d).forEach(k => { delivered[k] += d[k]; });
    items.push({ product: p, rate: fixed[pid], unit: fertUnitFor(p), primary: (byProduct[pid] || ["N"])[0], forNutrients: byProduct[pid] || [] });
    delete byProduct[pid];
  });
  // remaining products, ordered so P/K/S products (which also carry N) resolve
  // before the pure-N product fills whatever N is still short
  Object.keys(byProduct)
    .sort((a, b) => Math.min(...byProduct[a].map(n => RANK[n])) - Math.min(...byProduct[b].map(n => RANK[n])))
    .forEach(pid => {
      const p = FERT_PRODUCTS.find(x => x.id === pid);
      if (!p) return;
      const nuts = byProduct[pid].slice().sort((a, b) => RANK[a] - RANK[b]);
      let rate = 0;
      nuts.forEach(nut => {
        const need = Math.max(0, (targets[nut] || 0) - (delivered[nut] || 0));
        if (need > (nut === "Lime" ? 0.05 : 1)) rate = Math.max(rate, fertRateFor(p, nut, need));
      });
      if (!(rate > 0)) return;
      const d = fertDelivers(p, rate);
      Object.keys(d).forEach(k => { delivered[k] += d[k]; });
      items.push({ product: p, rate, unit: fertUnitFor(p), primary: nuts[0], forNutrients: nuts });
    });
  return { items, delivered };
}

function computeFertilizerPlan({ needs, soilTest, forage, yieldGoalTons, useType, month, weather, nearWater, distToWater, daysSinceCut, form }) {
  const want = needs || {};
  const st = soilTest || null;
  const use = (useType === "hay" || useType === "both") ? "hay" : "pasture";
  const g = FERT_N_GUIDE[use];
  const yg = Number(yieldGoalTons) > 0 ? Number(yieldGoalTons) : (use === "hay" ? 4 : 0);
  const tF = weather && weather.current ? weather.current.tempF : null;
  const hoursToRain = weather ? weather.hoursToRain : null;
  const isDormant = DORMANT_MONTHS.includes(month);

  const recs = [];   // { nutrient, perAcre, unit, basis }
  const flags = [];
  const products = [];

  // ---------- Nitrogen (rates are annual totals; see split note in the UI) ----------
  if (want.n) {
    let nRate, basis, perPass;
    if (use === "hay") {
      nRate = Math.min(g.annualCap, Math.round(g.maintenancePerTon * yg));
      perPass = Math.min(g.perCutting, Math.round(nRate / Math.max(2, Math.round(nRate / g.perCutting))));
      basis = `${nRate} lb N/ac for the year on a ${yg}-ton hay goal (~${g.maintenancePerTon} lb N/ton removed). Split into about ${Math.max(2, Math.round(nRate / g.perCutting))} passes of ~${perPass} lb N/ac — a third to a half at green-up, then after each cutting, done by ~Sept 1.`;
    } else {
      const base = use === "pasture" ? g.rotational : g.continuous;
      nRate = Math.min(g.annualCap, base * 2 + (yg > 0 ? 20 : 0));
      basis = `~${nRate} lb N/ac for the year on grazed grass, in 2–3 splits, heavier in spring. Push higher only if you're managing rotationally and rainfall is reliable.`;
    }
    recs.push({ nutrient: "N", perAcre: nRate, unit: "lb N/ac/yr", basis });
    const nProducts = FERT_PRODUCTS.filter(p => !p.blend && p.nPct > 0 && !(p.pPct > 0) && !(p.kPct > 0) && (form === "both" || p.form === form));
    nProducts.forEach(p => {
      if (p.form === "liquid" && p.nLbPerGal) {
        products.push({ product: p, forNutrient: "N", perAcre: Math.round((nRate / p.nLbPerGal) * 10) / 10, unit: "gal/ac/yr" });
      } else if (p.nPct) {
        products.push({ product: p, forNutrient: "N", perAcre: Math.round(nRate / (p.nPct / 100)), unit: "lb/ac/yr" });
      }
    });
    // volatilization
    const usingUrea = form !== "liquid";
    if (usingUrea && tF != null && tF > 80 && (hoursToRain == null || hoursToRain > 48)) {
      flags.push({ level: "warn", ref: nutrientLabel("N"), text: `Currently ${Math.round(tF)}°F with no rain in the forecast window — broadcast urea can lose 15–30% of its N to the air over a few days. Use ammonium sulfate, treat the urea with a urease inhibitor (NBPT / Agrotain), or wait to spread right before rain.` });
    }
    if (isDormant) {
      flags.push({ level: "warn", ref: nutrientLabel("N"), text: `Bermuda/bahia is dormant in ${month} — nitrogen now mostly feeds winter annual weeds (ryegrass, chickweed, henbit). Hold N until ~100% green-up, usually March–April across the Southeast.` });
    }
    if (["September", "October"].includes(month)) {
      flags.push({ level: "warn", ref: nutrientLabel("N"), text: "Nitrogen after about September 1 pushes tender growth that winter-kills, and can worsen winter weed pressure. A light late application is only worth it if you're stockpiling for winter grazing." });
    }
    if (use === "pasture" && want.n && st == null) {
      flags.push({ level: "info", ref: nutrientLabel("N"), text: "On grazed grass, heavy N on drought-stressed forage that's then grazed hard can spike nitrate — risky for cattle. Fertilize into growing conditions, not a dry spell." });
    }
    if (use === "hay" && daysSinceCut != null) {
      if (daysSinceCut <= 10) {
        flags.push({ level: "info", ref: nutrientLabel("N"), text: `This field was cut ~${daysSinceCut} day${daysSinceCut === 1 ? "" : "s"} ago — once you see green regrowth, that's the time to put the next split (~${perPass || 60} lb N/ac) on. Fertilizing right after a cutting is how you feed the coming growth, not the crop you just hauled off.` });
      } else if (daysSinceCut > 45 && !isDormant && !["September", "October"].includes(month)) {
        flags.push({ level: "info", ref: nutrientLabel("N"), text: `It's been ~${daysSinceCut} days since the last cutting logged for this field — if it's regrown and you're not cutting again soon, it may be past the point where a split pays off.` });
      }
    }
  }

  // ---------- Phosphorus (annual) ----------
  if (want.p) {
    let pRate = 40, basis = "no soil test entered — 40 lb P₂O₅/ac/yr is a typical low-testing starting rate; a $15 soil test will tell you if you need any at all.";
    if (st && st.pPpm !== "" && st.pPpm != null) {
      const ppm = Number(st.pPpm);
      if (ppm >= 50) { pRate = use === "hay" ? Math.round(yg * 15) : 0; basis = `soil P ${ppm} ppm is high — ${use === "hay" ? `replace only hay removal, ~${pRate} lb P₂O₅/ac/yr (~15 lb/ton)` : "no P needed this year"}.`; }
      else if (ppm >= 25) { pRate = 30; basis = `soil P ${ppm} ppm is medium — ~30 lb P₂O₅/ac/yr.`; }
      else { pRate = 50; basis = `soil P ${ppm} ppm is low — ~50 lb P₂O₅/ac/yr.`; }
    }
    if (pRate > 0) {
      recs.push({ nutrient: "P₂O₅", perAcre: pRate, unit: "lb P₂O₅/ac/yr", basis });
      FERT_PRODUCTS.filter(p => !p.blend && p.pPct > 0 && !(p.kPct > 0) && (form === "both" || p.form === form)).forEach(p => {
        products.push({ product: p, forNutrient: "P₂O₅", perAcre: p.form === "liquid" ? Math.round((pRate / (p.pPct / 100)) / 11 * 10) / 10 : Math.round(pRate / (p.pPct / 100)), unit: p.form === "liquid" ? "gal/ac/yr" : "lb/ac/yr" });
      });
    } else {
      recs.push({ nutrient: "P₂O₅", perAcre: 0, unit: "lb P₂O₅/ac/yr", basis });
    }
    if (nearWater) {
      flags.push({ level: "warn", ref: nutrientLabel("P₂O₅"), text: `Phosphorus is the nutrient that drives pond and lake algae/weed blooms. Keep P fertilizer back from the water's edge (${distToWater ? distToWater + " ft is this field's water setback" : "at least 50–100 ft"}), and never spread it right before a heavy rain — ${hoursToRain != null ? `rain is ~${hoursToRain} hr out right now` : "check the forecast first"}.` });
    }
  }

  // ---------- Potassium (annual) ----------
  if (want.k) {
    let kRate = 60, basis = "no soil test entered — 60 lb K₂O/ac/yr is a typical starting rate; hay fields especially should soil test, K is the one they run short on.";
    if (st && st.kPpm !== "" && st.kPpm != null) {
      const ppm = Number(st.kPpm);
      const removal = Math.round(yg * 42);
      if (ppm >= 200) { kRate = use === "hay" ? removal : 0; basis = `soil K ${ppm} ppm is high — ${use === "hay" ? `replace only hay removal, ~${kRate} lb K₂O/ac/yr (~42 lb/ton)` : "no K needed for pasture this year"}.`; }
      else if (ppm >= 125) { kRate = use === "hay" ? removal : 40; basis = `soil K ${ppm} ppm is medium — ${use === "hay" ? `match removal, ~${kRate} lb K₂O/ac/yr` : "~40 lb K₂O/ac/yr"}.`; }
      else { kRate = use === "hay" ? Math.max(100, removal + 30) : 60; basis = `soil K ${ppm} ppm is low — ~${kRate} lb K₂O/ac/yr (removal plus some build-up).`; }
    }
    if (kRate > 0) {
      recs.push({ nutrient: "K₂O", perAcre: kRate, unit: "lb K₂O/ac/yr", basis });
      FERT_PRODUCTS.filter(p => !p.blend && p.kPct > 0 && !(p.nPct > 0) && !(p.pPct > 0)).forEach(p => {
        products.push({ product: p, forNutrient: "K₂O", perAcre: Math.round(kRate / (p.kPct / 100)), unit: "lb/ac/yr" });
      });
      if (form === "liquid") flags.push({ level: "info", ref: nutrientLabel("K₂O"), text: "There's no practical liquid potassium source for pasture — potash (0-0-60) or sulfate of potash goes out dry even if the rest of your program runs through the sprayer." });
      if (kRate > 60) flags.push({ level: "info", ref: nutrientLabel("K₂O"), text: `That's an annual figure — split it. Put no more than ~60 lb K₂O/ac on at once (with your N applications). A big single potash dose causes luxury uptake and, on grazed grass in spring, nudges grass-tetany risk.` });
    } else {
      recs.push({ nutrient: "K₂O", perAcre: 0, unit: "lb K₂O/ac/yr", basis });
    }
  }

  // ---------- Lime ----------
  if (want.lime) {
    if (st && st.ph !== "" && st.ph != null) {
      const ph = Number(st.ph);
      if (ph >= 6.2) {
        recs.push({ nutrient: "Lime", perAcre: 0, unit: "tons/ac", basis: `soil pH ${ph} is fine for bermuda/bahia — no lime needed.` });
      } else {
        const tons = Math.min(4, Math.round((6.5 - ph) * 2 * 10) / 10);
        recs.push({ nutrient: "Lime", perAcre: tons, unit: "tons ag lime/ac", basis: `soil pH ${ph} — roughly ${tons} tons/ac ag lime to reach ~6.5. Use the lab's exact recommendation (it accounts for buffer pH); this is an estimate.` });
        flags.push({ level: "warn", ref: "Soil pH", text: `pH ${ph}: lime first. Nitrogen and potassium are markedly less efficient in acid soil — you can be feeding grass that can't use it. Lime takes 6+ months to move pH and can't be incorporated into established sod, so get it out well ahead.` });
        products.push({ product: FERT_PRODUCTS.find(p => p.id === "aglime"), forNutrient: "Lime", perAcre: tons, unit: "tons/ac" });
        products.push({ product: FERT_PRODUCTS.find(p => p.id === "pellime"), forNutrient: "Lime", perAcre: Math.round(tons * 0.5 * 10) / 10, unit: "tons/ac (higher NV — use lab rate)" });
      }
    } else {
      recs.push({ nutrient: "Lime", perAcre: null, unit: "", basis: "no pH entered — a soil test is the only way to size a lime application; guessing wastes money in both directions." });
    }
  }

  // ---------- Sulfur ----------
  if (want.s) {
    recs.push({ nutrient: "S", perAcre: 20, unit: "lb S/ac", basis: "~20 lb S/ac on sandy, low-OM soil, or just use ammonium sulfate / 28-0-0-5S to cover your N and S in one pass." });
  }

  // ---------- General flags ----------
  if (nearWater && want.n) {
    flags.push({ level: "warn", ref: nutrientLabel("N"), text: `Nitrogen runs off and leaches toward surface water too, especially on sandy ground. Split applications (never more than ~60–70 lb N/ac at once), skip a buffer strip along the water's edge, and don't spread with heavy rain in the forecast${hoursToRain != null ? ` — currently ~${hoursToRain} hr out` : ""}.` });
  }
  if (use === "hay") {
    flags.push({ level: "info", ref: "Nutrient removal", text: "Every ton of bermuda hay hauled off takes roughly 50 lb N, 15 lb P₂O₅, and 42 lb K₂O with it (land-grant extension figures) — potassium is the one hay fields mine out first, since it's the nutrient most easily and quickly depleted by continuous cutting. A soil test every 2–3 years keeps the stand from thinning." });
  }
  if (!st) {
    flags.push({ level: "info", ref: "Soil test", text: "These are starting rates from forage type and yield goal only. A routine soil test (~$15–25 through your state's land-grant lab) pays for itself the first year by right-sizing P, K, and lime instead of guessing." });
  }
  const macroCount = [want.n, want.p, want.k].filter(Boolean).length;
  if (macroCount >= 2) {
    const nn = recs.find(r => r.nutrient === "N");
    const pp = recs.find(r => r.nutrient === "P₂O₅");
    const kk = recs.find(r => r.nutrient === "K₂O");
    const ratio = [nn ? nn.perAcre : 0, pp ? pp.perAcre : 0, kk ? kk.perAcre : 0];
    flags.push({ level: "info", ref: "Blend", text: `Since you need ${macroCount === 3 ? "all three" : macroCount + " of the three"}, a custom dry blend near ${ratio.join("-")} (lb/ac/yr of N-P₂O₅-K₂O) is one spreader pass instead of three separate materials. Your co-op can mix to spec — the straight-product amounts above are the cross-check.` });
  }
