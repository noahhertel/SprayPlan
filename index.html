function analyzePestMix(selected) {
  const flags = [];
  // Duplicate IRAC group — parse the group tokens so premixes ("3A + 28") still match.
  const groupCount = {};
  selected.forEach(p => groupTokens(p.iracGroup).forEach(g => { (groupCount[g] = groupCount[g] || []).push(p.name); }));
  Object.keys(groupCount).forEach(g => {
    if (groupCount[g].length > 1) flags.push({ level: "warn", text: `${[...new Set(groupCount[g])].join(" + ")} are both IRAC group ${g} — same site of action, so it adds cost and resistance pressure without adding spectrum. Rotate groups instead of stacking them.` });
  });

  // Same active ingredient across two products (e.g. Besiege + Prevathon both carry
  // chlorantraniliprole, or Besiege + a straight pyrethroid).
  sharedActives(selected, INS_ACTIVES).forEach(s => {
    flags.push({ level: "danger", text: `${s.products.join(" and ")} both contain ${s.active} — that's a double dose in one pass and pushes past the annual per-acre limit for it. Use one or the other.` });
  });

  const bait = selected.filter(p => p.formulation === "bait");
  if (bait.length && selected.length > 1) flags.push({ level: "danger", text: `${bait.map(p => p.name).join(", ")} is a dry broadcast bait, not a tank-mix partner — put it out separately with a spreader.` });
  const bees = selected.filter(p => p.beeTox === "high");
  if (bees.length) flags.push({ level: "warn", text: `${bees.map(p => p.name).join(", ")} ${bees.length > 1 ? "are" : "is"} highly bee-toxic, so the whole batch is — spray at dusk, never on blooming cover.` });
  const ru = selected.filter(p => p.restrictedUse);
  if (ru.length) flags.push({ level: "warn", text: `${ru.map(p => p.name).join(", ")} restricted-use — applicator license covers the whole tank.` });
  const order = {
    dry: selected.filter(p => p.formulation === "dry"),
    soluble: selected.filter(p => p.formulation === "soluble"),
    ec: selected.filter(p => p.formulation === "ec")
  };
  const maxGraze = Math.max(0, ...selected.map(p => phiDays(p.grazing)));
  const maxHay = Math.max(0, ...selected.map(p => phiDays(p.hay)));
  const maxRei = Math.max(0, ...selected.map(p => Number(p.rei) || 0));
  flags.forEach(f => { if (!f.ref) f.ref = "Tank mix"; });
  return { flags, order, maxGraze, maxHay, maxRei, buffer: Math.max(0, ...selected.map(p => p.waterBufferFt)) };
}

/* ============================================================
   PLAN HELPERS — group products by goal, pick a recommended mix,
   and turn a low/med/high choice into a concrete oz/ac number.
   ============================================================ */

function rateForMode(p, mode) {
  const lo = Number(p.rateLowOz), hi = Number(p.rateHighOz);
  if (mode === "low") return lo;
  if (mode === "high") return hi;
  return Math.round(((lo + hi) / 2) * 100) / 100;
}

// Roll the per-field recommendation lists up into one ranked product list per goal
// (a weed or pest id). A product counts for a goal if it hits that goal on at
// least one selected field; fields where it isn't eligible are penalised + noted.
function planGoalGroups(goalIds, fieldPlans, nameOf) {
  const allFields = fieldPlans.map(fp => fp.name);
  return goalIds.map(gid => {
    const m = new Map();
    fieldPlans.forEach(fp => {
      (fp.recommendations || []).forEach(c => {
        if (!c.hits.includes(gid)) return;
        if (!m.has(c.herbicide.id)) m.set(c.herbicide.id, { product: c.herbicide, scoreSum: 0, n: 0, fieldFlags: [], eligible: [] });
        const e = m.get(c.herbicide.id);
        e.scoreSum += c.score;
        e.n += 1;
        e.eligible.push(fp.name);
        c.flags.forEach(f => { if (f.level !== "info") e.fieldFlags.push({ field: fp.name, level: f.level, text: f.text }); });
      });
    });
    const products = [...m.values()].map(e => {
      const ineligible = allFields.filter(n => !e.eligible.includes(n));
      return {
        product: e.product,
        score: e.scoreSum / e.n - ineligible.length * 6,
        eligible: e.eligible,
        ineligible,
        fieldFlags: e.fieldFlags,
        partial: ineligible.length > 0
      };
    }).sort((a, b) => b.score - a.score);
    return { goalId: gid, goalName: nameOf(gid), products };
  });
}

// Fewest compatible products that still cover every goal: top pick per goal,
// deduped. If a danger-level conflict names two of the picks, drop the one
// covering fewer goals and re-pick its goals from compatible alternatives.
function recommendMix(goalGroups, analyzeFn) {
  const activesMap = analyzeFn === analyzePestMix ? INS_ACTIVES : HERB_ACTIVES;
  const chosen = new Map();
  const uncovered = [];
  goalGroups.forEach(g => {
    if (g.products.length === 0) { uncovered.push(g.goalName); return; }
    const already = g.products.find(p => chosen.has(p.product.id));
    if (already) { chosen.get(already.product.id).goals.push(g.goalName); return; }
    const pick = g.products[0];
    chosen.set(pick.product.id, { product: pick.product, goals: [g.goalName] });
  });

  // A candidate product is compatible with the current mix only if adding it
  // introduces no danger flag.
  const compatibleWithMix = (prod, extraIds) => {
    const set = new Set([...chosen.keys(), ...(extraIds || [])]);
    if (set.has(prod.id)) return true;
    const list = [prod, ...[...set].map(id => (analyzeFn === analyzePestMix ? INSECTICIDES : HERBICIDES).find(p => p.id === id)).filter(Boolean)];
    return !analyzeFn(list).flags.some(f => f.level === "danger");
  };

  let analysis = analyzeFn([...chosen.values()].map(c => c.product));
  let guard = 0;
  while (analysis.flags.some(f => f.level === "danger") && guard < 5) {
    guard += 1;
    const danger = analysis.flags.find(f => f.level === "danger");
    const offenders = [...chosen.values()].filter(c => danger.text.includes(c.product.name));
    if (offenders.length < 2) break; // can't attribute it to a swappable pair
    offenders.sort((a, b) => b.goals.length - a.goals.length);
    const drop = offenders[offenders.length - 1];
    chosen.delete(drop.product.id);
    let progressed = false;
    drop.goals.forEach(goalName => {
      const g = goalGroups.find(x => x.goalName === goalName);
      if (!g) return;
      if (g.products.some(p => chosen.has(p.product.id))) { progressed = true; return; }
      const alt = g.products.find(p => p.product.id !== drop.product.id && !chosen.has(p.product.id) && compatibleWithMix(p.product));
      if (alt) { chosen.set(alt.product.id, { product: alt.product, goals: [goalName] }); progressed = true; }
      else uncovered.push(goalName + " (only conflicting options)");
    });
    analysis = analyzeFn([...chosen.values()].map(c => c.product));
    if (!progressed) break;
  }

  // ---- Independent failsafe pass ----
  const kind = analyzeFn === analyzePestMix ? "pest" : "weed";
  let vet = vetMix([...chosen.values()].map(c => c.product), kind);
  let vetGuard = 0;
  while (!vet.ok && chosen.size > 1 && vetGuard < 8) {
    vetGuard += 1;
    // drop the least valuable pick: fewest goals, then lowest score
    const ranked = [...chosen.values()].sort((a, b) => {
      if (a.goals.length !== b.goals.length) return a.goals.length - b.goals.length;
      const sa = (goalGroups.flatMap(g => g.products).find(p => p.product.id === a.product.id) || {}).score || 0;
      const sb = (goalGroups.flatMap(g => g.products).find(p => p.product.id === b.product.id) || {}).score || 0;
      return sa - sb;
    });
    const drop = ranked[0];
    chosen.delete(drop.product.id);
    drop.goals.forEach(g => {
      const stillCovered = [...chosen.values()].some(c => (goalGroups.find(x => x.goalName === g) || { products: [] }).products.some(p => p.product.id === c.product.id));
      if (!stillCovered) uncovered.push(g + " (held back by the safety check)");
    });
    vet = vetMix([...chosen.values()].map(c => c.product), kind);
  }

  const finalProducts = [...chosen.values()].map(c => c.product);
  const finalAnalysis = analyzeFn(finalProducts);
  const finalVet = vetMix(finalProducts, kind);
  const engineClean = !finalAnalysis.flags.some(f => f.level === "danger");
  return {
    items: [...chosen.values()],
    ids: [...chosen.keys()],
    flags: finalAnalysis.flags,
    uncovered: [...new Set(uncovered)],
    vetted: finalVet.ok && engineClean,
    vetReviews: finalVet.reviews,
    disagreement: finalVet.ok !== engineClean
  };
}

  const activeFields = pestPlans.filter(fp => (planSelections[fp.name] || []).length > 0);
  const totalAcres = activeFields.reduce((s, fp) => s + (Number(fp.profile.acreage) > 0 ? Number(fp.profile.acreage) : 0), 0);

  const selectedProducts = products.map(p => p.product);

    const pest = PESTS.find(x => x.id === pid);

const CAL_KIND_LABEL = { fert: "Fertility", herbicide: "Herbicide", pest: "Pest", restriction: "Restriction", window: "Window", cut: "Cutting" };

// Region-generic bermuda / bahia pasture & hay calendar (0-indexed month ranges).
const SEASONAL_WINDOWS = [
  { m0: 0, m1: 2, title: "Dormant-season grass & pre-emergent", detail: "Bermuda/bahia dormant: broadcast glyphosate on dallisgrass, johnsongrass, bahiagrass, and ryegrass, and put out a pre-emergent (Prowl H2O, Rezilon) for sandbur and crabgrass ahead of germination." },
  { m0: 2, m1: 3, title: "Spring green-up — first nitrogen", detail: "At ~100% bermuda green-up: the first nitrogen of the year, and imazapic (Plateau / Panoramic) if you're after smutgrass, vaseygrass, or bahiagrass." },
  { m0: 2, m1: 5, title: "Spring broadleaf window", detail: "Thistle, buttercup, ragweed, bitterweed and other broadleaves are small and growing — 2,4-D + dicamba, GrazonNext / DuraCor, or metsulfuron before they bolt or bloom." },
  { m0: 4, m1: 9, title: "Fall armyworm scouting", detail: "Walk new growth and every field after a cutting, weekly. Treat at 2–3 larvae per square foot in hay. A diamide (Prevathon) or IGR gives the most reliable kill." },
  { m0: 4, m1: 5, title: "Grasshopper border-treat", detail: "Treat field margins and ditches while nymphs are small — a border strip now beats a whole-field rescue spray in August." },
  { m0: 5, m1: 8, title: "Bermudagrass stem maggot", detail: "7–10 days after each cutting, as regrowth greens up. Bifenthrin is the usual pick." },
  { m0: 7, m1: 7, title: "Last nitrogen by ~September 1", detail: "Nitrogen after early September pushes tender growth that winter-kills and feeds winter weeds. Stop unless you're stockpiling for winter grazing." },
  { m0: 8, m1: 10, title: "Lime & soil-test window", detail: "Fall is the time to lime — it needs 6+ months to move pH before spring. Pull soil tests now so you buy to a number, not a guess." },
  { m0: 8, m1: 10, title: "Fall broadleaf & winter-annual control", detail: "Perennials are moving sugars to the roots (best time to hit horsenettle, dock, and sericea), and winter annuals (henbit, chickweed, ryegrass) are germinating — a fall pass carries you clean into spring." },
  { m0: 9, m1: 10, title: "Bermuda & bahia going dormant", detail: "First frost usually lands late October to mid-November across the Southeast (later toward the coast). Growth stops, the stand browns off, and the window closes on fall herbicide, stockpile nitrogen, and anything that needs actively growing grass. Once the field is fully brown, dormant-season glyphosate on dallisgrass, johnsongrass, and bristlegrass becomes an option." },
];

function calendarEventsForMonth(year, m0, data) {
  const events = [];
  const mStart = new Date(year, m0, 1), mEnd = new Date(year, m0 + 1, 0);
  const inMonth = iso => { const d = new Date(iso + "T12:00:00"); return d >= mStart && d <= mEnd; };
  const push = (dateISO, field, kind, title, detail, tag) => { if (dateISO && inMonth(dateISO)) events.push({ dateISO, field, kind, title, detail, tag }); };

  const apps = (data.applications || []).filter(a => a.date);
  const cuts = (data.cuttings || []).filter(c => c.date && c.field);
  const cutInterval = Math.min(90, Math.max(14, Math.round(Number(data.cutIntervalDays) || 30)));
  const fields = [...new Set([...Object.keys(data.fieldProfiles || {}), ...apps.map(a => a.field), ...cuts.map(c => c.field)].filter(Boolean))];

  // ---- What actually happened this month (from the logs) ----
  cuts.forEach(c => push(c.date, c.field, "cut", "Hay cut", c.notes ? `Logged cutting — ${c.notes}` : "Logged cutting.", "logged"));
  apps.forEach(a => {
    const kind = a.category === "fertilizer" ? "fert" : a.category === "insecticide" ? "pest" : "herbicide";
    const label = a.category === "fertilizer" ? "Fertilizer" : a.category === "insecticide" ? "Insecticide" : "Herbicide";
    push(a.date, a.field, kind, a.herbicideName || label, `${label} applied${a.rate ? " — " + a.rate : ""}.`, "logged");
  });

  fields.forEach(field => {
    const prof = (data.fieldProfiles || {})[field] || {};
    const isHay = prof.useType === "hay" || prof.useType === "both";
    const grassLc = (prof.grass || "").toLowerCase();
    const isRyegrass = grassLc.includes("ryegrass") || grassLc.includes("overseed");
    const fApps = apps.filter(a => a.field === field).sort((a, b) => a.date.localeCompare(b.date));
    const fCuts = cuts.filter(c => c.field === field).sort((a, b) => a.date.localeCompare(b.date));

    if (isRyegrass) {
      push(`${year}-10-01`, field, "fert", "Overseed ryegrass", "Around early October, once the bermuda is slowing: graze or mow it down tight, then drill (~25–30 lb/ac) or broadcast (~35–40 lb/ac) annual ryegrass so the seedlings reach light.", "window");
      push(`${year}-11-15`, field, "fert", "Ryegrass starter nitrogen", "Once the ryegrass is up and tillering (3+ leaves), ~50–60 lb N/ac kicks off winter growth. Repeat in February for the spring grazing flush.", "window");
      push(`${year}-02-15`, field, "fert", "Ryegrass spring nitrogen", "Second ryegrass N of the season for the spring grazing surge, before it heads out and the bermuda takes back over.", "window");
    }

    const r = computeFieldRestrictions(field, apps);
    if (r.graze.until) push(r.graze.until, field, "restriction", "Grazing OK", `${shortProductName(r.graze.product)} grazing interval ends.`, "restriction");
    if (r.hay.until) push(r.hay.until, field, "restriction", "Hay OK", `${shortProductName(r.hay.product)} hay interval ends.`, "restriction");
    if (r.carry.until) push(r.carry.until, field, "restriction", "Carryover hold lifts", `The aminopyralid / picloram hay & manure hold from ${shortProductName(r.carry.product)} lifts (approximate).`, "restriction");

    const msmaApps = fApps.filter(a => a.herbicideId === "msma");
    if (msmaApps.length === 1) push(shiftISO(msmaApps[0].date, { days: 9 }), field, "herbicide", "MSMA 2nd pass", "The label calls for a second application 7–10 days after the first for dallisgrass.", "due");
    ["pendimethalin", "indaziflam"].forEach(id => {
      const a = fApps.filter(x => x.herbicideId === id);
      if (a.length === 1) push(shiftISO(a[0].date, { days: 80 }), field, "herbicide", "Pre-emergent follow-up", "Season-long sandbur / crabgrass control usually needs a follow-up or split ~10–12 weeks after the first pass.", "window");
    });

    const lastCutISO = fCuts.length ? fCuts[fCuts.length - 1].date : null;
    let seed = lastCutISO || (isHay ? `${year}-05-20` : null);
    if (seed) {
      let d = seed;
      for (let n = 0; n < 8; n++) {
        const cutISO = n === 0 ? d : shiftISO(d, { days: cutInterval });
        d = cutISO;
        const mm = Number(cutISO.slice(5, 7));
        if (mm < 4 || mm > 9) break;
        const logged = !!fCuts.find(c => c.date === cutISO);
        if (!logged) push(cutISO, field, "cut", "Hay cut (projected)", `Projected on a ~${cutInterval}-day cutting cycle — this shifts as you actually cut. Set the interval on the Logs tab.`, "projected");
        if (isHay) {
          push(shiftISO(cutISO, { days: 7 }), field, "fert", "Post-cut nitrogen", "Once regrowth greens up, ~50–60 lb N/ac to feed the next cutting.", logged ? "due" : "projected");
          if (mm >= 7 && mm <= 9) push(shiftISO(cutISO, { days: 8 }), field, "pest", "Stem maggot check", "7–10 days after this cut, as regrowth greens up.", "window");
        }
      }
    }

    const fertApps = fApps.filter(a => a.category === "fertilizer" || /fertilizer/i.test(a.herbicideId || ""));
    if (fertApps.length) {
      const last = fertApps[fertApps.length - 1];
      const splitGap = cutInterval + 5;
      push(shiftISO(last.date, { days: splitGap }), field, "fert", "Next fertilizer split", `About ${splitGap} days since the last fertilizer pass — on a hay cutting cycle the next split is roughly due.`, "due");
    }

    const st = prof.soilTest, ph = st && st.ph ? Number(st.ph) : null;
    if (ph != null && ph < 6.0) push(`${year}-10-01`, field, "fert", "Lime this fall", `Soil pH ${ph} — lime needs the winter to move pH. Budget about ${Math.min(4, Math.round((6.5 - ph) * 2 * 10) / 10)} tons/ac ag lime.`, "window");
    else if (!st) push(`${year}-09-15`, field, "fert", "Pull a soil test", `No soil test on file for this field — a fall test right-sizes P, K, and lime for next year.`, "window");
  });

  SEASONAL_WINDOWS.forEach(s => {
    if (m0 >= s.m0 && m0 <= s.m1) events.push({ dateISO: `${year}-${String(m0 + 1).padStart(2, "0")}-01`, field: null, kind: "window", title: s.title, detail: s.detail, tag: "seasonal", seasonal: true });
  });

  // Frost in the live forecast = the dormancy trigger. Flag the first forecast day
  // at/below ~36°F (light frost possible in low spots).
  const fc = (data.weather && data.weather.forecast) || [];
  const frostDay = fc.find(d => d.loF != null && d.loF <= 36);
  if (frostDay && inMonth(frostDay.date)) {
    events.push({ dateISO: frostDay.date, field: null, kind: "restriction", title: "Frost in the forecast", detail: `Forecast low ${Math.round(frostDay.loF)}°F. First frost stops bermuda and bahia growth for the year — get any fall herbicide, stockpile nitrogen, or actively-growing-grass job done before it, and treat the stand as dormant afterward.`, tag: "window" });
  }

  return events.sort((a, b) => a.dateISO.localeCompare(b.dateISO) || (a.seasonal ? -1 : 1));
}

const CAL_KIND_ICON = { cut: Scissors, fert: Sprout, herbicide: Droplets, pest: Bug, restriction: AlertTriangle, window: CalendarDays };

// One tooltip string for all the events of a single kind on a single day —
// "Hay cut — Hay Meadow, South Field" per distinct title, newline-separated.
function summarizeCalGroup(evs) {
  const byTitle = {};
  evs.forEach(e => { (byTitle[e.title] = byTitle[e.title] || []); if (e.field) byTitle[e.title].push(e.field); });
  return Object.keys(byTitle).map(t => {
    const fs = [...new Set(byTitle[t])];
    return fs.length ? `${t} — ${fs.join(", ")}` : t;
  }).join("\n");
}

// Collapse the "Dated this month" list: one row per date+kind+title+tag, with
// every field that shares it gathered onto that row.
function collapseCalDated(dated) {
  const map = new Map();
  dated.forEach(e => {
    const key = [e.dateISO, e.kind, e.title, e.tag].join("|");
    if (!map.has(key)) map.set(key, { dateISO: e.dateISO, kind: e.kind, title: e.title, detail: e.detail, tag: e.tag, fields: [] });
    if (e.field) map.get(key).fields.push(e.field);
  });
  return [...map.values()]
    .map(e => ({ ...e, fields: [...new Set(e.fields)] }))
    .sort((a, b) => a.dateISO.localeCompare(b.dateISO));
}

    body = h(CustomProductsPanel, { customProducts: customs, onSave: onSaveCustom, onRemove: onRemoveCustom });
  } else if (!searching) {
    const k = sub === "herbicides" ? "herbicide" : sub === "insecticides" ? "insecticide" : "fertilizer";
    const builtin = sub === "herbicides" ? HERBICIDES.map(herbCard) : sub === "insecticides" ? INSECTICIDES.map(insCard) : FERT_PRODUCTS.map(fertCard);
    body = h("div", { className: "space-y-2" }, builtin, customsOfKind(k).map(customCard));
  } else {
    const hM = HERBICIDES.filter(x => x.name.toLowerCase().includes(ql) || matchTarget(x.targets, WEEDS));
    const iM = INSECTICIDES.filter(x => x.name.toLowerCase().includes(ql) || matchTarget(x.targets, PESTS));
    const fM = FERT_PRODUCTS.filter(x => x.name.toLowerCase().includes(ql) || x.analysis.toLowerCase().includes(ql) || (x.note || "").toLowerCase().includes(ql));
    const cM = customs.filter(matchCustom);
    body = (hM.length + iM.length + fM.length + cM.length) === 0
      ? h("p", { className: "text-sm text-[#6B7A5E] py-3" }, `Nothing matches “${q}”. Search a product name, or a weed / pest — for example “sandbur”, “fall armyworm”, “dicamba”, “potash”.`)
      : h("div", { className: "space-y-4" }, section("herbicide" + (hM.length === 1 ? "" : "s") + " labeled for this", hM.map(herbCard)), section("insecticide" + (iM.length === 1 ? "" : "s") + " labeled for this", iM.map(insCard)), section("fertilizer product" + (fM.length === 1 ? "" : "s"), fM.map(fertCard)), section("of your own product" + (cM.length === 1 ? "" : "s"), cM.map(customCard)));
  }

  return h("div", { className: "space-y-4" },
    searchBox,
    !searching && h("div", { className: "flex gap-2 flex-wrap" }, subTab("herbicides", "Herbicides"), subTab("insecticides", "Insecticides"), subTab("fertilizer", "Fertilizer"), subTab("yours", `Yours${customs.length ? " (" + customs.length + ")" : ""}`)),
    body,
    h("p", { className: "text-[10px] text-[#9CA391]" }, "Reference figures only — the current product label is the legal document and it overrides anything here. “Labeled for this” means our data links the product to that weed or pest; always confirm the current label lists it and at what rate. Restricted-use status, PHIs, buffers, and EPA numbers change."));
}
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(SprayPlanner));
</script>
</body>
</html>
