/* ============================================================
   LOCAL STORAGE SHIM
   Standalone replacement for the Claude-artifact-only window.storage
   API, backed by the browser's real localStorage. Same method shapes
   (get/set/delete/list, all async, all return {key, value} objects)
   so none of the app code below needs to change.
   ============================================================ */
const STORAGE_PREFIX = "spray-ticket:";
// Probe real localStorage. It throws on opaque origins (some preview sandboxes)
// and is disabled for file:// pages in Firefox — fall back to an in-memory store
// so the app still works for the session instead of flashing a save-failed warning.
const _mem = new Map();
let _ls = null;
try {
  const t = STORAGE_PREFIX + "__probe__";
  window.localStorage.setItem(t, "1");
  window.localStorage.removeItem(t);
  _ls = window.localStorage;
} catch (e) {
  _ls = null;
}
window.storage = {
  async get(key) {
    const k = STORAGE_PREFIX + key;
    let v = null;
    try { v = _ls ? _ls.getItem(k) : (_mem.has(k) ? _mem.get(k) : null); }
    catch (e) { v = _mem.has(k) ? _mem.get(k) : null; }
    if (v == null) return null;
    return {
      key,
      value: v
    };
  },
  async set(key, value) {
    const k = STORAGE_PREFIX + key;
    try {
      if (_ls) _ls.setItem(k, value);
      else _mem.set(k, value);
    } catch (e) {
      _mem.set(k, value);
    }
    return {
      key,
      value
    };
  },
  async delete(key) {
    const k = STORAGE_PREFIX + key;
    try { if (_ls) _ls.removeItem(k); } catch (e) {}
    _mem.delete(k);
    return {
      key,
      deleted: true
    };
  },
  async list(prefix) {
    const full = STORAGE_PREFIX + (prefix || "");
    let src = [];
    try { src = _ls ? Object.keys(_ls) : Array.from(_mem.keys()); }
    catch (e) { src = Array.from(_mem.keys()); }
    const keys = src.filter(k => k.startsWith(full)).map(k => k.slice(STORAGE_PREFIX.length));
    return {
      keys
    };
  }
};

const WIND_CARDINALS = ["N", "NNE", "NE", "ENE", "E", "ESE", "SE", "SSE", "S", "SSW", "SW", "WSW", "W", "WNW", "NW", "NNW"];
const windCardinal = deg => WIND_CARDINALS[Math.round(((deg || 0) % 360) / 22.5) % 16];

// Stull (2011) wet-bulb approximation, then Delta-T (dry-bulb minus wet-bulb, in °C).
// Delta-T is the standard sprayer-friendly read on evaporation: ~2–8 ideal, 8–10
// marginal, >10 too much droplet loss, <2 very slow drying / inversion-prone.
function deltaT_C(tempF, rhPct) {
  if (tempF == null || rhPct == null) return null;
  const T = (tempF - 32) * 5 / 9;
  const rh = Math.max(1, Math.min(100, rhPct));
  const Tw =
    T * Math.atan(0.151977 * Math.sqrt(rh + 8.313659)) +
    Math.atan(T + rh) -
    Math.atan(rh - 1.676331) +
    0.00391838 * Math.pow(rh, 1.5) * Math.atan(0.023101 * rh) -
    4.686035;
  return Math.round((T - Tw) * 10) / 10;
}

async function geocodeZip(zip) {
  const r = await fetch(`https://api.zippopotam.us/us/${zip}`);
  if (!r.ok) throw new Error(`ZIP ${zip} not found — check the digits.`);
  const j = await r.json();
  const p = (j.places || [])[0];
  if (!p) throw new Error(`No location on file for ZIP ${zip}.`);
  return {
    lat: Number(p.latitude),
    lon: Number(p.longitude),
    place: `${p["place name"]}, ${p["state abbreviation"]} ${zip}`
  };
}

async function fetchOpenMeteo(lat, lon) {
  const qs = new URLSearchParams({
    latitude: lat,
    longitude: lon,
    current: "temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m,wind_gusts_10m,wind_direction_10m,is_day",
    hourly: "precipitation,precipitation_probability",
    daily: "temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max",
    temperature_unit: "fahrenheit",
    wind_speed_unit: "mph",
    precipitation_unit: "inch",
    timezone: "auto",
    past_days: "31",
    forecast_days: "4"
  });
  const r = await fetch(`https://api.open-meteo.com/v1/forecast?${qs}`);
  if (!r.ok) throw new Error("Weather service didn't respond — try again in a minute.");
  return r.json();
}

function buildSprayWeather(place, raw) {
  const cur = raw.current || {};
  const daily = raw.daily || {};
  const hourly = raw.hourly || {};
  const nowISO = cur.time || new Date().toISOString().slice(0, 16);
  const today = nowISO.slice(0, 10);

  // ---- rain history: days since last measurable (>=0.01") rain, and 14-day total
  const dTimes = daily.time || [];
  const dRain = daily.precipitation_sum || [];
  const dTMax = daily.temperature_2m_max || [];
  let daysSinceRain = null;
  let rain14 = 0;
  const todayIdx = dTimes.indexOf(today);
  const lastIdx = todayIdx >= 0 ? todayIdx : dTimes.length - 1;
  for (let i = lastIdx; i >= 0; i--) {
    if ((dRain[i] || 0) >= 0.01 && daysSinceRain === null) daysSinceRain = lastIdx - i;
    if (lastIdx - i < 14) rain14 += dRain[i] || 0;
  }
  if (daysSinceRain === null) daysSinceRain = Math.min(31, lastIdx + 1); // dry the whole window

  // ---- recent high: hottest of the last 3 days incl. today
  let recentHighF = null;
  for (let i = Math.max(0, lastIdx - 2); i <= lastIdx; i++) {
    if (dTMax[i] != null) recentHighF = Math.max(recentHighF ?? -999, dTMax[i]);
  }

  // ---- next rain: first forward hour with >=0.02" or >=55% probability
  const hTimes = hourly.time || [];
  const hRain = hourly.precipitation || [];
  const hProb = hourly.precipitation_probability || [];
  const nowMs = new Date(nowISO).getTime();
  let hoursToRain = null;
  for (let i = 0; i < hTimes.length; i++) {
    const ms = new Date(hTimes[i]).getTime();
    if (ms < nowMs) continue;
    if ((hRain[i] || 0) >= 0.02 || (hProb[i] || 0) >= 55) {
      hoursToRain = Math.max(0, Math.round((ms - nowMs) / 3600000));
      break;
    }
  }

  const tempF = cur.temperature_2m;
  const rh = cur.relative_humidity_2m;
  const windMph = cur.wind_speed_10m;
  const gustMph = cur.wind_gusts_10m;
  const dT = deltaT_C(tempF, rh);
  const isDay = cur.is_day === 1;

  // ---- forecast: next 3 days
  const forecast = [];
  for (let i = lastIdx + 1; i < dTimes.length && forecast.length < 3; i++) {
    forecast.push({
      date: dTimes[i],
      hiF: dTMax[i],
      loF: (daily.temperature_2m_min || [])[i],
      rainIn: dRain[i],
      rainProb: (daily.precipitation_probability_max || [])[i],
      windMax: (daily.wind_speed_10m_max || [])[i]
    });
  }

  // ---- spray-timing flags (drift / evaporation / rainfastness / temperature)
  const flags = [];
  if (windMph != null) {
    if (windMph > 15)
      flags.push({ level: "danger", text: `Wind ${Math.round(windMph)} mph${gustMph ? `, gusting ${Math.round(gustMph)}` : ""} — over the ~10–15 mph ceiling on most labels. High drift risk, especially toward the lake. Wait for a calmer window.` });
    else if (windMph >= 10)
      flags.push({ level: "warn", text: `Wind ${Math.round(windMph)} mph out of the ${windCardinal(cur.wind_direction_10m)} — near the upper limit. OK for coarse droplets away from sensitive areas; hold off near water, gardens, or tree lines.` });
    else if (windMph < 3)
      flags.push({ level: "warn", text: `Wind only ${Math.round(windMph)} mph${isDay ? "" : " and it's not full daylight"} — dead calm can mean a temperature inversion that holds spray in a cloud and drifts it off-target. Spray once you can see steady leaf and flag movement (3–10 mph).` });
    else
      flags.push({ level: "info", text: `Wind ${Math.round(windMph)} mph out of the ${windCardinal(cur.wind_direction_10m)} — in the ideal 3–10 mph band for on-target coverage.` });
  }
  if (dT != null) {
    if (dT > 10) flags.push({ level: "warn", text: `Delta-T ${dT} — high evaporation. Fine droplets can dry before they reach the leaf; shift to early morning or evening.` });
    else if (dT < 2) flags.push({ level: "info", text: `Delta-T ${dT} — very humid, slow drying. Watch for long leaf wetness and runoff if you're close to water.` });
    else if (dT > 8) flags.push({ level: "info", text: `Delta-T ${dT} — marginal (ideal 2–8). Workable, but don't push the hottest part of the day.` });
    else flags.push({ level: "info", text: `Delta-T ${dT} — in the ideal 2–8 range for spray retention.` });
  }
  if (hoursToRain != null) {
    if (hoursToRain <= 6) flags.push({ level: "danger", text: `Rain likely in about ${hoursToRain} hr — most products need at least 4–6 rain-free hours (some 24). Wash-off and runoff to the lake are the likely result today.` });
    else if (hoursToRain <= 24) flags.push({ level: "warn", text: `Rain likely in about ${hoursToRain} hr — fine for fast-drying products, risky for anything needing a 24-hour rain-free window. Check the label before you mix.` });
  }
  if (tempF != null) {
    if (tempF < 60) flags.push({ level: "warn", text: `Currently ${Math.round(tempF)}°F — below 60°F many pasture herbicides act slowly on weeds that aren't actively growing. Warmer, sunny days work better.` });
    else if (tempF > 90) flags.push({ level: "warn", text: `Currently ${Math.round(tempF)}°F — above ~85–90°F, ester products (Remedy Ultra, PastureGard HL) can vaporize and drift. Use amine forms or wait for a cooler window.` });
  }
  if (daysSinceRain >= 21) flags.push({ level: "info", text: `${daysSinceRain}+ days since measurable rain — drought-stressed weeds take up herbicide poorly. Best results come after a soaking rain and a few days of green-up.` });

  return {
    place,
    fetchedAt: new Date().toISOString(),
    current: { tempF, rh, windMph, gustMph, dirDeg: cur.wind_direction_10m, dirCard: windCardinal(cur.wind_direction_10m), precipIn: cur.precipitation, isDay },
    deltaT: dT,
    recentHighF,
    daysSinceRain,
    rain14,
    hoursToRain,
    forecast,
    flags
  };
}

async function getSprayWeather(zip) {
  const g = await geocodeZip(zip);
  const raw = await fetchOpenMeteo(g.lat, g.lon);
  return buildSprayWeather(g.place, raw);
}

// Pure recommendation engine — computes ranked herbicide matches for one field's
// context (weeds present, use type, water proximity, recent application history,
// today's conditions, and month). Called once per selected field so multi-field
// plans get per-field-accurate flags (water buffer, MOA rotation, timing).
function computeRecommendations({
  weeds,
  useType,
  nearWater,
  distToWater,
  applications,
  rainExpected,
  daysSinceRain,
  month
}) {
  if (!weeds || weeds.length === 0) return {
    candidates: [],
    excludedByTiming: []
  };
  const recentMoaGroups = applications.slice().sort((a, b) => (b.date || "").localeCompare(a.date || "")).slice(0, 4).map(a => {
    const h = HERBICIDES.find(h => h.id === a.herbicideId);
    return h ? h.moa : null;
  }).filter(Boolean);
  const excludedByTiming = [];
  const isDormantMonth = DORMANT_MONTHS.includes(month);
  const candidates = HERBICIDES.map(h => {
    const hits = h.targets.filter(t => weeds.includes(t));
    if (hits.length === 0) return null;
    const useOk = useType === "both" ? h.use.includes("pasture") || h.use.includes("hay") : h.use.includes(useType);
    if (!useOk) return null;

    // Hard eligibility gate: a product whose timing prerequisite isn't met this month
    // doesn't get suggested at all (e.g. no broadcast glyphosate in August) — it's
    // excluded here rather than shown with a warning.
    const timing = TIMING_RULES[h.id];
    if (timing) {
      const prereqFailed = timing.requires === "dormant" && !isDormantMonth || timing.requires === "dormant-or-method" && !isDormantMonth || timing.requires === "active" && isDormantMonth;
      if (prereqFailed) {
        excludedByTiming.push({
          id: h.id,
          name: h.name,
          reason: timing.note
        });
        return null;
      }
    }
    const flags = [];
    if (nearWater && distToWater < h.waterBufferFt) {
      flags.push({
        level: "danger",
        text: `Water buffer: label calls for ~${h.waterBufferFt} ft from water; this field's profile has ${distToWater} ft to the lake/pond.`
      });
    }
    if (recentMoaGroups.filter(m => m === h.moa).length >= 2) {
      flags.push({
        level: "warn",
        text: `You've used MOA group ${h.moa} in ${recentMoaGroups.filter(m => m === h.moa).length} of this field's last 4 logged applications — consider rotating to a different mode of action to slow resistance.`
      });
    }
    if (h.restrictedUse) {
      flags.push({
        level: "warn",
        text: "Verify current registration/restricted-use status before applying — this product's labeled uses have shifted in recent years."
      });
    }
    if (h.manureMonths > 0) {
      flags.push({
        level: "warn",
        text: `Aminopyralid carryover: don't give away or sell hay/manure from this field for ~${h.manureMonths} months — it can damage broadleaf crops/gardens wherever it ends up.`
      });
    }
    if (rainExpected) {
      flags.push({
        level: "warn",
        text: "Rain expected — most of these products want 4–6 hrs (some 24 hrs) rain-free after application to avoid wash-off and runoff to the lake."
      });
    }
    if (daysSinceRain !== "" && Number(daysSinceRain) > 21) {
      flags.push({
        level: "info",
        text: "Dry stretch (3+ weeks) — drought-stressed weeds absorb herbicide poorly. Consider waiting for a green-up or dropping the surfactant rate up slightly per label."
      });
    }
    const score = hits.length * 10 - flags.filter(f => f.level === "danger").length * 100 - flags.filter(f => f.level === "warn").length * 2;
    return {
      herbicide: h,
      hits,
      flags,
      score
    };
  }).filter(Boolean);
  candidates.sort((a, b) => b.score - a.score);
  return {
    candidates,
    excludedByTiming
  };
}

/* ============================================================
   TANK MIX RULES ENGINE
   Grounded in: WALES/DALES mixing-order convention (VCE/Sprayers101/UNL
   extension guidance), the general label rule against tank-mixing two
   ALS-inhibitor (Group 2) products together (HSE / EPA label guidance),
   and specific documented combos from Corteva/university pasture-weed
   publications (Arkansas MP522/MP44, GrazonNext HL label). This is a
   planning aid, not a substitute for the specimen label of every
   product in the mix — the label always governs.
   ============================================================ */

const KNOWN_COMBOS = [{
  pair: ["grazonnext", "remedyultra"],
  level: "info",
  text: "GrazonNext HL + Remedy Ultra is a well-documented, picloram-free one-pass broadleaf + brush combo used in university pasture-weed guides."
}, {
  pair: ["grazonnext", "pasturegard"],
  level: "info",
  text: "GrazonNext HL + PastureGard HL is called out on the GrazonNext label itself as an effective tank-mix partner for one-pass weed and brush control."
}, {
  pair: ["chaparral", "pasturegard"],
  level: "info",
  text: "Chaparral + PastureGard HL is a commonly recommended combo for tougher brush like buckbrush."
}, {
  pair: ["grazonnext", "pastora"],
  level: "info",
  text: "GrazonNext HL + Pastora is a labeled, commonly used combination for broader broadleaf + johnsongrass control in hay fields."
}, {
  pair: ["msma", "24d"],
  level: "warn",
  text: "MSMA + 2,4-D is a workable, commonly used combo, but MSMA performs best above ~70°F — a cool-weather application can underperform on the target weed while still stressing the bermuda."
}, {
  pair: ["pastora", "glyphosate"],
  level: "info",
  text: "Pastora + a low rate of glyphosate (roughly 6–8 fl oz/ac of a 4 lb/gal formulation) is a university-documented combo for perennial/regrowth sandbur and vaseygrass that Pastora alone won't fully knock back — it stunts bermuda more than Pastora alone, so time it right after a cutting."
}];
function analyzeTankMix(selected) {
  const flags = [];
  const ids = selected.map(h => h.id);

  // Rule: don't stack two ALS (Group 2) inhibitors in one mix.
  // Match "2" as a standalone group token so MOA "22" (paraquat) doesn't false-match.
  const alsProducts = selected.filter(h => /\b2\b/.test(h.moa));
  if (alsProducts.length >= 2) {
    flags.push({
      level: "danger",
      text: `${alsProducts.map(h => h.name).join(" + ")} are both Group 2 (ALS-inhibitor) products. Labels generally restrict tank-mixing or sequencing two ALS herbicides together, and it stacks resistance-selection pressure on the same site of action. Don't combine these unless a current label explicitly allows it.`
    });
  }

  // Known documented combos (good or cautionary)
  KNOWN_COMBOS.forEach(c => {
    if (c.pair.every(id => ids.includes(id))) flags.push({
      level: c.level,
      text: c.text
    });
  });

  // Glyphosate is non-selective — flag it outside the one documented Pastora combo
  if (ids.includes("glyphosate")) {
    const documented = ids.includes("pastora") && selected.length === 2;
    if (!documented) {
      flags.push({
        level: "danger",
        text: "Glyphosate is non-selective — it will damage or kill bermuda along with whatever else is in this mix, regardless of what else you're tank-mixing it with. Outside the specific Pastora + low-rate-glyphosate combo, adding glyphosate to a mix usually isn't what you want on a stand you're trying to keep."
      });
    }
  }

  // Restricted-use inheritance
  const ru = selected.filter(h => h.restrictedUse);
  if (ru.length > 0) {
    flags.push({
      level: "warn",
      text: `${ru.map(h => h.name).join(", ")} ${ru.length > 1 ? "are" : "is"} restricted-use — verify registration status and applicator licensing before mixing, same as spraying it alone.`
    });
  }

  // Manure/hay carryover inheritance — worst case governs the whole batch
  const carry = selected.filter(h => h.manureMonths > 0);
  if (carry.length > 0) {
    const months = Math.max(...carry.map(h => h.manureMonths));
    flags.push({
      level: "warn",
      text: `${carry.map(h => h.name).join(", ")} carries an aminopyralid hay/manure restriction (~${months} months). Because it's in the mix, the WHOLE batch of hay or manure off this field inherits that restriction — even the parts that came from the other products.`
    });
  }

  // Most restrictive water buffer / grazing / hay govern the mix as a whole
  const buffer = Math.max(...selected.map(h => h.waterBufferFt));

  // Mixing order per WALES/DALES: dry → water-soluble liquid → EC/ester → surfactant
  const order = {
    dry: selected.filter(h => h.formulation === "dry"),
    soluble: selected.filter(h => h.formulation === "soluble"),
    ec: selected.filter(h => h.formulation === "ec")
  };
  return {
    flags,
    buffer,
    order
  };
}

// Pests whose control hinges on a growth stage or season more than on the
// weed/soil inputs — these get an automatic timing note (mirrors TIMING_RULES).
const PEST_SEASON = {
  fallarmyworm: { months: ["July", "August", "September", "October"], note: "fall armyworm flights run mid-summer into fall in East Texas — scout new growth and fields after a cutting" },
  truearmyworm: { months: ["April", "May", "June", "September"], note: "true armyworm is a spring/early-summer and again early-fall pest" },
  stemmaggot: { months: ["July", "August", "September"], note: "stem maggot damage shows up in mid to late summer on regrowth after a cutting" },
  aphid: { months: ["March", "April", "May", "September", "October", "November"], note: "aphids build in the cooler shoulder seasons, not the heat of summer" },
};

// Pulls the worst-case (largest) number of days out of a PHI string like "14 days",
// "0–30 days by rate", or "40-day cutting restriction" — parseInt alone would grab
// only the first number ("0" out of "0–30 days by rate"), silently hiding the
// higher end of a rate-dependent restriction. Returns 0 for non-numeric text like
// "Check current label — varies" (a safe-but-uninformative fallback, not a claim
// that the restriction is actually zero).
function phiDays(str) {
  if (str == null) return 0;
  const nums = String(str).match(/\d+/g);
  if (!nums) return 0;
  return Math.max(...nums.map(Number));
}

function computePestControl({ pests, useType, nearWater, distToWater, applications, rainExpected, daysSinceRain, month, weather }) {
  if (!pests || pests.length === 0) return { candidates: [], excludedByTiming: [] };
  const recentGroups = applications
    .slice()
    .sort((a, b) => (b.date || "").localeCompare(a.date || ""))
    .slice(0, 4)
    .map(a => {
      const p = INSECTICIDES.find(x => x.id === a.herbicideId);
      return p ? p.iracGroup : null;
    })
    .filter(Boolean);
  const windMph = weather && weather.current ? weather.current.windMph : null;
  const excludedByTiming = [];
  const candidates = INSECTICIDES.map(p => {
    const hits = p.targets.filter(t => pests.includes(t));
    if (hits.length === 0) return null;
    const useOk = useType === "both" ? p.use.includes("pasture") || p.use.includes("hay") : p.use.includes(useType);
    if (!useOk) return null;

    const flags = [];
    if (nearWater && distToWater < p.waterBufferFt) {
      flags.push({ level: "danger", text: `Water buffer: this product's label calls for ~${p.waterBufferFt} ft from water and it's toxic to aquatic life; this field's profile has ${distToWater} ft to the lake/pond.` });
    }
    if (windMph != null && windMph > 10) {
      flags.push({ level: windMph > 15 ? "danger" : "warn", text: `Wind is ${Math.round(windMph)} mph right now — insecticide drift onto the lake, gardens, or a neighbor's bees is the risk. Spray under 10 mph.` });
    }
    if (recentGroups.filter(g => g === p.iracGroup).length >= 2) {
      flags.push({ level: "warn", text: `IRAC group ${p.iracGroup} shows up in ${recentGroups.filter(g => g === p.iracGroup).length} of this field's last 4 logged sprays — rotate to a different group. (Note: all pyrethroids are group 3A — switching brands isn't rotating.)` });
    }
    if (p.iracGroup.startsWith("3A") && hits.some(h => h === "fallarmyworm" || h === "truearmyworm")) {
      flags.push({ level: "warn", text: "Fall armyworm has documented pyrethroid (group 3A) resistance across much of the South — a pyrethroid can give a poor kill on a heavy flight. A diamide (Prevathon) or IGR is the more reliable choice on worms." });
    }
    if (p.restrictedUse) {
      flags.push({ level: "warn", text: "Restricted-use pesticide — applicator license required. Verify current registration before buying." });
    }
    if (p.beeTox === "high") {
      flags.push({ level: "warn", text: "Highly toxic to bees. Don't spray blooming clover, vetch, or flowering weeds, and stay off during foraging hours — spray at dusk or after dark and let it dry." });
    } else if (p.beeTox === "moderate") {
      flags.push({ level: "info", text: "Toxic to bees while the spray is wet; dries safe within a few hours. Spray in the evening if there's blooming cover in the stand." });
    }
    if (phiDays(p.grazing) > 0 || phiDays(p.hay) > 0) {
      flags.push({ level: "info", text: `Pre-harvest interval: ${p.grazing} before grazing, ${p.hay} before cutting hay. Restricted-entry ${p.rei} hr.` });
    }
    if (rainExpected && p.formulation !== "bait") {
      flags.push({ level: "warn", text: "Rain in the forecast — this needs a few hours dry on the plant to work; a wash-off means re-treating." });
    }
    if (p.formulation === "bait" && daysSinceRain !== "" && Number(daysSinceRain) < 1) {
      flags.push({ level: "warn", text: "Ground is wet — fire ant bait molds and ants ignore it. Wait for a dry, warm stretch with ants actively foraging." });
    }
    if (hits.includes("grasshopper") && daysSinceRain !== "" && Number(daysSinceRain) > 21) {
      flags.push({ level: "info", text: "Grasshopper numbers climb in drought and they move in from field margins and ditches — treating a border strip early, while nymphs are small, beats a whole-field rescue spray later." });
    }

    const score = hits.length * 10
      - flags.filter(f => f.level === "danger").length * 100
      - flags.filter(f => f.level === "warn").length * 2
      + (p.beeTox === "low" ? 2 : 0)
      + (p.iracGroup.startsWith("28") || p.iracGroup.startsWith("18") ? 3 : 0);
    return { herbicide: p, hits, flags, score };
  }).filter(Boolean);

  // season timing note (soft — shown, not excluded, since scouting overrides the calendar)
  pests.forEach(pid => {
    const s = PEST_SEASON[pid];
    if (s && !s.months.includes(month)) {
      const pest = PESTS.find(x => x.id === pid);
      excludedByTiming.push({ id: pid, name: pest ? pest.name : pid, reason: s.note });
    }
  });

  candidates.sort((a, b) => b.score - a.score);
  return { candidates, excludedByTiming };
}

/* ============================================================
   FERTILIZER  (dry broadcast + liquid through the sprayer)
   Not a target-matching problem — it's rate math off a soil test
   or a yield goal, plus timing / runoff / volatilization flags.
   ============================================================ */

const FERT_NUTRIENTS = [
  { id: "n", label: "Nitrogen (N)", blurb: "Drives grass growth and hay tonnage — the one you reapply every year and after every cutting." },
  { id: "p", label: "Phosphorus (P₂O₅)", blurb: "Root and stand establishment. Bermuda needs little once established; soil test before spending on it." },
  { id: "k", label: "Potassium (K₂O)", blurb: "Stand persistence and winter-hardiness. Hay fields mine it out fast — the one most often short." },
  { id: "lime", label: "Lime (raise pH)", blurb: "Below pH ~5.5, applied N and K work far less efficiently. Lime is slow — plan 6+ months ahead." },
  { id: "s", label: "Sulfur (S)", blurb: "Sandy East-Texas soils low in organic matter are often S-short; shows as pale yellowing that N won't fix." },
];

// N starting rates (lb N/ac) by forage use and management intensity. Deliberately
// conservative single-application figures for a split program, not annual totals.
const FERT_N_GUIDE = {
  hay: { maintenancePerTon: 50, perCutting: 60, springGreenup: 70, annualCap: 300 },
  pasture: { rotational: 60, continuous: 40, springGreenup: 50, annualCap: 180 },
};

const FERT_PRODUCTS = [
  { id: "urea", name: "Urea", analysis: "46-0-0", form: "dry", nPct: 46, pPct: 0, kPct: 0, sPct: 0, note: "Cheapest N per pound, but the most prone to volatilization loss when it's hot and dry with no rain coming." },
  { id: "ammsulfate", name: "Ammonium sulfate", analysis: "21-0-0-24S", form: "dry", nPct: 21, pPct: 0, kPct: 0, sPct: 24, note: "No volatilization loss, and it supplies sulfur — good on sandy soils. More product per acre and it acidifies soil over time (watch pH)." },
  { id: "uan32", name: "UAN solution", analysis: "32-0-0", form: "liquid", nPct: 32, lbPerGal: 11.06, nLbPerGal: 3.54, note: "Standard liquid N through the sprayer. Half the N is urea, so streamer/dribble bars beat flat-fan tips and reduce leaf burn and volatilization." },
  { id: "uan28", name: "UAN + sulfur", analysis: "28-0-0-5S", form: "liquid", nPct: 28, lbPerGal: 10.8, nLbPerGal: 3.02, note: "Liquid N with a little sulfur built in — a common one-pass hay-field material." },
  { id: "dap", name: "DAP", analysis: "18-46-0", form: "dry", nPct: 18, pPct: 46, kPct: 0, note: "Most common dry phosphate; also carries some N." },
  { id: "map1034", name: "Ammonium polyphosphate", analysis: "10-34-0", form: "liquid", nPct: 10, pPct: 34, note: "Liquid P for the sprayer; keep it away from certain tank-mix partners (jar-test)." },
  { id: "potash", name: "Muriate of potash", analysis: "0-0-60", form: "dry", kPct: 60, note: "Standard dry K. Split large K applications — over ~60 lb K₂O at once can cause luxury uptake and, rarely, grass tetany risk in grazing." },
  { id: "sop", name: "Sulfate of potash", analysis: "0-0-50-18S", form: "dry", kPct: 50, sPct: 18, note: "K plus sulfur, lower salt index than muriate — costs more." },
  { id: "aglime", name: "Ag lime (ground)", analysis: "pH", form: "dry", note: "Cheapest way to raise pH; needs 6+ months and ideally incorporation, which you can't do in established sod — so plan ahead and be patient." },
  { id: "pellime", name: "Pelletized lime", analysis: "pH", form: "dry", note: "Spreads through fertilizer equipment and acts a little faster than ground lime, at a higher price per unit of neutralizing value." },
  { id: "blend171717", name: "Complete blend", analysis: "17-17-17", form: "dry", blend: true, nPct: 17, pPct: 17, kPct: 17, note: "A balanced starting blend when a soil test shows all three low; usually cheaper to buy N, P, K separately once you know the real ratio." },
  { id: "blend15515", name: "Hay blend", analysis: "15-5-15 (typical)", form: "dry", blend: true, nPct: 15, pPct: 5, kPct: 15, note: "Roughly matches what a ton of bermuda hay removes — a reasonable custom blend spec for a maintenance hay-field application." },
];

function lbToTons(lb) { return Math.round((lb / 2000) * 100) / 100; }

function computeFertilizerPlan({ needs, soilTest, forage, yieldGoalTons, useType, month, weather, nearWater, distToWater, form }) {
  const want = needs || {};
  const st = soilTest || null;
  const use = (useType === "hay" || useType === "both") ? "hay" : "pasture";
  const g = FERT_N_GUIDE[use];
  const yg = Number(yieldGoalTons) > 0 ? Number(yieldGoalTons) : (use === "hay" ? 4 : 0);
  const tF = weather && weather.current ? weather.current.tempF : null;
  const hoursToRain = weather ? weather.hoursToRain : null;
  const isDormant = DORMANT_MONTHS.includes(month);

  const recs = [];   // { nutrient, perAcre, unit, basis }
  const flags = [];
  const products = [];

  // ---------- Nitrogen (rates are annual totals; see split note in the UI) ----------
  if (want.n) {
    let nRate, basis, perPass;
    if (use === "hay") {
      nRate = Math.min(g.annualCap, Math.round(g.maintenancePerTon * yg));
      perPass = Math.min(g.perCutting, Math.round(nRate / Math.max(2, Math.round(nRate / g.perCutting))));
      basis = `${nRate} lb N/ac for the year on a ${yg}-ton hay goal (~${g.maintenancePerTon} lb N/ton removed). Split into about ${Math.max(2, Math.round(nRate / g.perCutting))} passes of ~${perPass} lb N/ac — a third to a half at green-up, then after each cutting, done by ~Sept 1.`;
    } else {
      const base = use === "pasture" ? g.rotational : g.continuous;
      nRate = Math.min(g.annualCap, base * 2 + (yg > 0 ? 20 : 0));
      basis = `~${nRate} lb N/ac for the year on grazed grass, in 2–3 splits, heavier in spring. Push higher only if you're managing rotationally and rainfall is reliable.`;
    }
    recs.push({ nutrient: "N", perAcre: nRate, unit: "lb N/ac/yr", basis });
    const nProducts = FERT_PRODUCTS.filter(p => !p.blend && p.nPct > 0 && !(p.pPct > 0) && !(p.kPct > 0) && (form === "both" || p.form === form));
    nProducts.forEach(p => {
      if (p.form === "liquid" && p.nLbPerGal) {
        products.push({ product: p, forNutrient: "N", perAcre: Math.round((nRate / p.nLbPerGal) * 10) / 10, unit: "gal/ac/yr" });
      } else if (p.nPct) {
        products.push({ product: p, forNutrient: "N", perAcre: Math.round(nRate / (p.nPct / 100)), unit: "lb/ac/yr" });
      }
    });
    // volatilization
    const usingUrea = form !== "liquid";
    if (usingUrea && tF != null && tF > 80 && (hoursToRain == null || hoursToRain > 48)) {
      flags.push({ level: "warn", text: `Currently ${Math.round(tF)}°F with no rain in the forecast window — broadcast urea can lose 15–30% of its N to the air over a few days. Use ammonium sulfate, treat the urea with a urease inhibitor (NBPT / Agrotain), or wait to spread right before rain.` });
    }
    if (isDormant) {
      flags.push({ level: "warn", text: `Bermuda/bahia is dormant in ${month} — nitrogen now mostly feeds winter annual weeds (ryegrass, chickweed, henbit). Hold N until ~100% green-up, usually April in East Texas.` });
    }
    if (["September", "October"].includes(month)) {
      flags.push({ level: "warn", text: "Nitrogen after about September 1 pushes tender growth that winter-kills, and can worsen winter weed pressure. A light late application is only worth it if you're stockpiling for winter grazing." });
    }
    if (use === "pasture" && want.n && st == null) {
      flags.push({ level: "info", text: "On grazed grass, heavy N on drought-stressed forage that's then grazed hard can spike nitrate — risky for cattle. Fertilize into growing conditions, not a dry spell." });
    }
  }

  // ---------- Phosphorus (annual) ----------
  if (want.p) {
    let pRate = 40, basis = "no soil test entered — 40 lb P₂O₅/ac/yr is a typical low-testing starting rate; a $15 soil test will tell you if you need any at all.";
    if (st && st.pPpm !== "" && st.pPpm != null) {
      const ppm = Number(st.pPpm);
      if (ppm >= 50) { pRate = use === "hay" ? Math.round(yg * 15) : 0; basis = `soil P ${ppm} ppm is high — ${use === "hay" ? `replace only hay removal, ~${pRate} lb P₂O₅/ac/yr (~15 lb/ton)` : "no P needed this year"}.`; }
      else if (ppm >= 25) { pRate = 30; basis = `soil P ${ppm} ppm is medium — ~30 lb P₂O₅/ac/yr.`; }
      else { pRate = 50; basis = `soil P ${ppm} ppm is low — ~50 lb P₂O₅/ac/yr.`; }
    }
    if (pRate > 0) {
      recs.push({ nutrient: "P₂O₅", perAcre: pRate, unit: "lb P₂O₅/ac/yr", basis });
      FERT_PRODUCTS.filter(p => !p.blend && p.pPct > 0 && !(p.kPct > 0) && (form === "both" || p.form === form)).forEach(p => {
        products.push({ product: p, forNutrient: "P₂O₅", perAcre: p.form === "liquid" ? Math.round((pRate / (p.pPct / 100)) / 11 * 10) / 10 : Math.round(pRate / (p.pPct / 100)), unit: p.form === "liquid" ? "gal/ac/yr" : "lb/ac/yr" });
      });
    } else {
      recs.push({ nutrient: "P₂O₅", perAcre: 0, unit: "lb P₂O₅/ac/yr", basis });
    }
    if (nearWater) {
      flags.push({ level: "warn", text: `Phosphorus is the nutrient that drives pond and lake algae/weed blooms. Keep P fertilizer back from the shoreline (${distToWater ? distToWater + " ft is this field's water setback" : "at least 50–100 ft"}), and never spread it right before a heavy rain — ${hoursToRain != null ? `rain is ~${hoursToRain} hr out right now` : "check the forecast first"}.` });
    }
  }

  // ---------- Potassium (annual) ----------
  if (want.k) {
    let kRate = 60, basis = "no soil test entered — 60 lb K₂O/ac/yr is a typical starting rate; hay fields especially should soil test, K is the one they run short on.";
    if (st && st.kPpm !== "" && st.kPpm != null) {
      const ppm = Number(st.kPpm);
      const removal = Math.round(yg * 42);
      if (ppm >= 200) { kRate = use === "hay" ? removal : 0; basis = `soil K ${ppm} ppm is high — ${use === "hay" ? `replace only hay removal, ~${kRate} lb K₂O/ac/yr (~42 lb/ton)` : "no K needed for pasture this year"}.`; }
      else if (ppm >= 125) { kRate = use === "hay" ? removal : 40; basis = `soil K ${ppm} ppm is medium — ${use === "hay" ? `match removal, ~${kRate} lb K₂O/ac/yr` : "~40 lb K₂O/ac/yr"}.`; }
      else { kRate = use === "hay" ? Math.max(100, removal + 30) : 60; basis = `soil K ${ppm} ppm is low — ~${kRate} lb K₂O/ac/yr (removal plus some build-up).`; }
    }
    if (kRate > 0) {
      recs.push({ nutrient: "K₂O", perAcre: kRate, unit: "lb K₂O/ac/yr", basis });
      FERT_PRODUCTS.filter(p => !p.blend && p.kPct > 0 && !(p.nPct > 0) && !(p.pPct > 0)).forEach(p => {
        products.push({ product: p, forNutrient: "K₂O", perAcre: Math.round(kRate / (p.kPct / 100)), unit: "lb/ac/yr" });
      });
      if (form === "liquid") flags.push({ level: "info", text: "There's no practical liquid potassium source for pasture — potash (0-0-60) or sulfate of potash goes out dry even if the rest of your program runs through the sprayer." });
      if (kRate > 60) flags.push({ level: "info", text: `That's an annual figure — split it. Put no more than ~60 lb K₂O/ac on at once (with your N applications). A big single potash dose causes luxury uptake and, on grazed grass in spring, nudges grass-tetany risk.` });
    } else {
      recs.push({ nutrient: "K₂O", perAcre: 0, unit: "lb K₂O/ac/yr", basis });
    }
  }

  // ---------- Lime ----------
  if (want.lime) {
    if (st && st.ph !== "" && st.ph != null) {
      const ph = Number(st.ph);
      if (ph >= 6.2) {
        recs.push({ nutrient: "Lime", perAcre: 0, unit: "tons/ac", basis: `soil pH ${ph} is fine for bermuda/bahia — no lime needed.` });
      } else {
        const tons = Math.min(4, Math.round((6.5 - ph) * 2 * 10) / 10);
        recs.push({ nutrient: "Lime", perAcre: tons, unit: "tons ag lime/ac", basis: `soil pH ${ph} — roughly ${tons} tons/ac ag lime to reach ~6.5. Use the lab's exact recommendation (it accounts for buffer pH); this is an estimate.` });
        flags.push({ level: "warn", text: `pH ${ph}: lime first. Nitrogen and potassium are markedly less efficient in acid soil — you can be feeding grass that can't use it. Lime takes 6+ months to move pH and can't be incorporated into established sod, so get it out well ahead.` });
        products.push({ product: FERT_PRODUCTS.find(p => p.id === "aglime"), forNutrient: "Lime", perAcre: tons, unit: "tons/ac" });
        products.push({ product: FERT_PRODUCTS.find(p => p.id === "pellime"), forNutrient: "Lime", perAcre: Math.round(tons * 0.5 * 10) / 10, unit: "tons/ac (higher NV — use lab rate)" });
      }
    } else {
      recs.push({ nutrient: "Lime", perAcre: null, unit: "", basis: "no pH entered — a soil test is the only way to size a lime application; guessing wastes money in both directions." });
    }
  }

  // ---------- Sulfur ----------
  if (want.s) {
    recs.push({ nutrient: "S", perAcre: 20, unit: "lb S/ac", basis: "~20 lb S/ac on sandy, low-OM soil, or just use ammonium sulfate / 28-0-0-5S to cover your N and S in one pass." });
  }

  // ---------- General flags ----------
  if (nearWater && want.n) {
    flags.push({ level: "warn", text: `Nitrogen runoff and leaching reach the lake too, especially on sandy ground. Split applications (never more than ~60–70 lb N/ac at once), skip a buffer strip along the shoreline, and don't spread with heavy rain in the forecast${hoursToRain != null ? ` — currently ~${hoursToRain} hr out` : ""}.` });
  }
  if (use === "hay") {
